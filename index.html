<style>

button.s{background:#1677ff22;border:1px solid #1677ff66}button.d{background:#b3261e}
select,input{background:var(--k);color:var(--w);border:1px solid #1677ff66;padding:8px;width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.warn{background:#3a2a00;border:1px solid #b88a00;border-radius:10px;padding:10px;margin-bottom:10px}

label{display:block;margin:10px 0 2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;overflow-x:auto;background:var(--k2);border-top:1px solid #1677ff55;padding-bottom:env(safe-area-inset-bottom)}

@media(min-width:900px){body{padding:0 0 0 180px}nav{top:0;bottom:auto;width:180px;height:100%;flex-direction:column;border-top:0;border-right:1px solid #1677ff55;padding-top:60px}nav button{text-align:left;padding:14px}nav button.on{box-shadow:inset 3px 0 var(--bl)}#toast{left:auto;width:360px;bottom:20px}}
</style></head><body>
<header></header><nav></nav><main></main><div id="toast"></div>
<noscript>JavaScript est nécessaire.</noscript>
<script>
/* ===== Core / Storage ===== */
const $=s=>document.querySelector(s),f2=(x,d=2)=>Number(x).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}),
esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),cl=x=>x>=0?'up':'dn',
dt=t=>new Date(t).toLocaleString('fr-FR'),SY=['BTC','ETH','SOL','XRP','BNB','ADA','DOGE'];
const DEF=()=>({cash:10000,init:10000,pos:[],hist:[],log:[],eq:[],peak:10000,dayStart:10000,day:new Date().toDateString(),emerg:false,halt:null,scalp:'stop',opp:'stop',ostrat:{trend:true,brk:true,pull:true,rev:true,mom:true,rvs:true,vol:true},strat:{mom:true,rev:true,trend:true,brk:true,vol:true},ord:[],al:[],stk:{url:''},sp:{mom:{rsiLo:52,rsiHi:68,slM:1.5,tpM:2.5},rev:{rsiMax:30,slM:1.5,tpM:2},trend:{slM:2,tpM:4},brk:{vmin:1.5,slM:1.5,tpM:3},vol:{vx:1.6,slM:1.5,tpM:3}},n:0,
cfg:{risk:.25,dayLoss:1,dd:5,maxPos:5,fee:.1,slip:.05,stale:60,budget:40,cd:60,minScore:60,minRR:1.2,maxHr:12,ordMin:10,expMax:70,oppBudget:40,oppMax:3,oppMinScore:60,oppMinRR:1.3,oppCd:900}});
function load(){try{const o=JSON.parse(localStorage.getItem('atc_v1'));if(o)return merge(o);}catch(e){}return null}
function merge(o){const d=DEF();return Object.assign(d,o,{cfg:Object.assign(d.cfg,o.cfg),sp:Object.assign(d.sp,o.sp),strat:Object.assign(d.strat,o.strat),ostrat:Object.assign(d.ostrat,o.ostrat)})}
function save(){try{localStorage.setItem('atc_v1',JSON.stringify(S))}catch(e){}}
let S=load()||DEF(),M={},H={},FX=0,page='dash',NEWS=null,BTR=null,BTS='BTC',LF='',CAP=S.init,bad=null,CD={},lastOk=0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',5000)}
/* Audit Engine */
function log(a,ty,m){S.log.unshift({t:Date.now(),a,ty,m});if(S.log.length>400)S.log.length=400;if(ty=='alerte')toast(m)}
/* ===== Market Data Engine (Binance : tickers + bougies 1 min OHLCV) ===== */
const BS=['https://data-api.binance.vision','https://api.binance.com'];
async function bj(p){for(const b of BS){const c=new AbortController(),h=setTimeout(()=>c.abort(),8000);try{const r=await fetch(b+p,{signal:c.signal});if(r.ok)return await r.json()}catch(e){}finally{clearTimeout(h)}}throw new Error('indisponible')}
let K={},D={rc:0,t:0,an:0,sig:0,prop:0,acc:0,ref:0,rej:{},sym:{},why:'',lr:'',sigT:0};
async function pull(){try{
 const d=await bj('/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify([...SY.map(s=>s+'USDT'),'EURUSDT'])));
 const fx=+d.find(x=>x.symbol=='EURUSDT').lastPrice;if(!(fx>0))throw 0;FX=fx;const now=Date.now();
 d.forEach(x=>{const s=x.symbol.replace('USDT','');if(s!='EUR')M[s]={p:+x.lastPrice/FX,chg:+x.priceChangePercent,vol:+x.quoteVolume/FX,t:now}});
 await Promise.all(SY.map(async s=>{try{const k=(await bj('/api/v3/klines?symbol='+s+'USDT&interval=1m&limit=120')).map(x=>({h:+x[2]/FX,l:+x[3]/FX,c:+x[4]/FX,v:+x[5]}));k.t=now;K[s]=k;H[s]=k.map(x=>x.c)}catch(e){}}));
 bad=null;lastOk=now}catch(e){bad='Données de marché indisponibles : aucune opération ne peut être ouverte tant que la connexion à Binance ne revient pas.'}}
const fresh=s=>M[s]&&Date.now()-M[s].t<S.cfg.stale*1000;
/* ===== Indicateurs & Analyst Engine ===== */
const sma=(a,n)=>a.slice(-n).reduce((x,y)=>x+y,0)/n,ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(x=>e=x*k+e*(1-k))},
sd=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)};
function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}return l==0?100:100-100/(1+g/l)}
function atr(k,n){let t=0;for(let i=k.length-n;i<k.length;i++)t+=Math.max(k[i].h-k[i].l,Math.abs(k[i].h-k[i-1].c),Math.abs(k[i].l-k[i-1].c));return t/n}
function ind(s){const k=K[s];if(!k||k.length<60||!fresh(s)||Date.now()-k.t>S.cfg.stale*1000)return null;
 const c=H[s],n=c.length,e12=ema(c,12),e26=ema(c,26),ml=e12.map((x,j)=>x-e26[j]),sg=ema(ml,9),m=sma(c,20),b=sd(c.slice(-20)),pv=k.slice(-22,-2);
 return{p:M[s].p,pc:c[n-2],r:rsi(c),f:sma(c,5),m,s50:sma(c,50),mh:ml[n-1]-sg[n-1],bu:m+2*b,bl:m-2*b,a:atr(k,14),ar:atr(k,5)/atr(k,30),vr:k[n-2].v/(pv.reduce((t,x)=>t+x.v,0)/20),hh:Math.max(...k.slice(-21,-1).map(x=>x.h))}}
const SD={
mom:{n:'Momentum',d:'Entrée : MA5>MA20, RSI dans la fourchette, MACD>signal. Sortie : MA5<MA20, stop ATR ou objectif ATR.',e:(i,P)=>i.f>i.m&&i.r>P.rsiLo&&i.r<P.rsiHi&&i.mh>0,x:i=>i.f<i.m},
rev:{n:'Mean Reversion',d:'Entrée (ordre limite sous le marché) : RSI en survente, prix sous la bande de Bollinger basse, bougie de rebond. Sortie : retour à la moyenne.',e:(i,P)=>i.r<P.rsiMax&&i.p<i.bl&&i.p>i.pc,x:i=>i.p>=i.m},
trend:{n:'Trend Following',d:'Entrée : prix>MA20>MA50 et MACD>signal. Sortie : prix<MA50.',e:i=>i.p>i.m&&i.m>i.s50&&i.mh>0,x:i=>i.p<i.s50},
brk:{n:'Breakout',d:'Entrée : cassure du plus haut des 20 dernières minutes avec volume au-dessus du seuil. Sortie : prix<MA20.',e:(i,P)=>i.p>i.hh&&i.vr>=P.vmin,x:i=>i.p<i.m},
vol:{n:'Trading de volatilité',d:'Entrée : expansion de la volatilité ATR(5)/ATR(30) au-dessus du seuil, prix>MA20, MACD>signal. Sortie : prix<MA20.',e:(i,P)=>i.ar>=P.vx&&i.p>i.m&&i.mh>0,x:i=>i.p<i.m}};
function analyse(s){const i=ind(s);if(!i)return{s,n:(H[s]||[]).length,sig:null};let b=null;
 for(const k in SD)if(S.strat[k]&&SD[k].e(i,S.sp[k])){const c=Math.min(95,50+(i.mh>0?15:0)+(i.vr>1.2?15:0)+(i.p>i.s50?15:0));if(!b||c>b.conf)b={st:k,conf:c}}
 return{s,n:H[s].length,i,r:i.r,f:i.f,m:i.m,p:i.p,sig:b?SD[b.st].n:null,st:b&&b.st,conf:b?b.conf:0}}
/* ===== Portfolio / Risk Engine ===== */
const eq=()=>S.cash+S.pos.reduce((t,x)=>t+x.q*(M[x.s]?M[x.s].p:x.e),0),engaged=a=>S.pos.filter(x=>!a||agOf(x)==a).reduce((t,x)=>t+x.q*x.e,0),
lossy=a=>{const h=S.hist.filter(x=>!a||agOf(x)==a).slice(0,3);return h.length>=3&&h.every(x=>x.pnl<0)},
reserved=()=>S.ord.filter(o=>o.status=='open').reduce((t,o)=>t+(o.q-o.filled)*o.lim*(1+S.cfg.fee/100),0);
function risk(p){const c=S.cfg,E=eq(),R=[];
 if(S.emerg)R.push('arrêt d\'urgence actif');if(S.halt)R.push('limite atteinte : '+S.halt);
 if(!fresh(p.s))R.push('donnée périmée ou absente');
 if(!(p.q>0)||!(p.sl<p.entry&&p.entry<p.tp))R.push('paramètres d\'ordre invalides');
 if(p.type=='limit'&&fresh(p.s)&&p.lim>=M[p.s].p)R.push('limite d\'achat au-dessus du marché');
 if(S.pos.length+S.ord.filter(o=>o.status=='open').length>=c.maxPos)R.push('nombre max de positions/ordres atteint');
 if(S.pos.some(x=>x.s==p.s)||S.ord.some(o=>o.s==p.s&&o.status=='open'))R.push('position ou ordre déjà ouvert sur '+p.s);
 if(p.risk>E*c.risk/100*1.001)R.push('risque '+f2(p.risk)+' € > limite '+f2(E*c.risk/100)+' €');
 if(p.cost>E*.25)R.push('exposition par actif > 25 %');if(engaged()+p.cost>E*c.expMax/100)R.push('exposition totale > '+c.expMax+' % du capital');if(agOf(p)=='opp'&&S.pos.filter(x=>agOf(x)=='opp').length+S.ord.filter(o=>o.status=='open'&&agOf(o)=='opp').length>=c.oppMax)R.push('nombre max de positions Opportunity atteint');
 if(p.cost+p.fee>S.cash-reserved())R.push('cash insuffisant');
 if(p.rr<c.minRR)R.push('rendement/risque net '+f2(p.rr)+' < '+c.minRR+' (frais et slippage inclus)');
 return R}
function limits(){const E=eq(),c=S.cfg;if(S.day!=new Date().toDateString()){S.day=new Date().toDateString();S.dayStart=E;if(S.halt&&S.halt.startsWith('perte'))S.halt=null}
 S.peak=Math.max(S.peak,E);if(S.halt)return;const dl=(E-S.dayStart)/S.dayStart*100,dd=(S.peak-E)/S.peak*100;
 if(dl<=-c.dayLoss)stop('perte journalière '+f2(dl)+' % (limite '+c.dayLoss+' %)');else if(dd>=c.dd)stop('drawdown '+f2(dd)+' % (limite '+c.dd+' %)')}
function stop(m){S.halt=m;if(S.scalp=='run')S.scalp='pause';if(S.opp=='run')S.opp='pause';log('Risk','alerte','Blocage automatique : '+m+'. Nouvelles opérations bloquées, agents suspendus.')}
/* ===== Simulation Engine : ordres marché / limite, exécutions partielles ===== */
function mkp(s,type,lim,sl,tp,q,st){const c=S.cfg,pr=M[s].p,f=c.fee/100,entry=type=='limit'?lim:pr*(1+c.slip/100),cost=q*entry,k=entry*(2*f+c.slip/100),rpu=entry-sl+k;
 return{s,type,lim,entry,sl,tp,q,cost,fee:cost*f,risk:q*rpu,rr:rpu>0?(tp-entry-k)/rpu:0,st}}
function order(p,R){const o={id:++S.n,s:p.s,type:p.type,lim:p.lim,entry:p.entry,q:p.q,filled:0,sl:p.sl,tp:p.tp,st:p.st,tf:p.tf,a:p.a,t:Date.now(),status:R?'rejected':'open',why:R?R.join(', '):''};
 S.ord.unshift(o);if(S.ord.length>200)S.ord.length=200;
 if(!R&&p.type=='market')fill(o,p.q,p.entry);else if(!R)log('Simulation','ordre',`Ordre limite ${o.id} ${p.s} @ ${f2(p.lim,4)} € en attente`)}
function fill(o,q,px){const fee=q*px*S.cfg.fee/100;S.cash-=q*px+fee;let x=S.pos.find(p=>p.oid==o.id);
 if(x){x.e=(x.e*x.q+px*q)/(x.q+q);x.q+=q;x.fee+=fee;x.hi=Math.max(x.hi,px)}else S.pos.push({id:++S.n,oid:o.id,s:o.s,q,e:px,sl:o.sl,tp:o.tp,hi:px,fee,t:Date.now(),st:o.st,tf:o.tf,a:o.a,r0:px-o.sl});
 o.filled+=q;if(o.q-o.filled<=o.q*1e-9)o.status='filled';log('Simulation','exécution',`${o.status=='filled'?'Exécution':'Exécution partielle'} ${o.s} ${f2(q,5)} @ ${f2(px,4)} € (frais ${f2(fee)} €)`)}
function orders(){const now=Date.now();S.ord.filter(o=>o.status=='open').forEach(o=>{
 if(now-o.t>S.cfg.ordMin*60000){o.status='cancelled';o.why='expiré';log('Simulation','ordre','Ordre '+o.id+' expiré');return}
 if(S.emerg||S.halt||!fresh(o.s))return;if(M[o.s].p<=o.lim){const r=o.q-o.filled;fill(o,r*.5*o.lim<10?r:r*.5,o.lim)}})}
function cancelAll(){S.ord.forEach(o=>{if(o.status=='open'){o.status='cancelled';o.why='arrêt d\'urgence'}})}
function close(x,why,px){const c=S.cfg,ex=px*(1-c.slip/100),pr=x.q*ex,fee=pr*c.fee/100,pnl=pr-fee-(x.q*x.e+x.fee);
 S.cash+=pr-fee;S.pos=S.pos.filter(p=>p.id!=x.id);S.hist.unshift({t:Date.now(),s:x.s,q:x.q,e:x.e,x:ex,pnl,fees:x.fee+fee,why,st:x.st});if(S.hist.length>500)S.hist.length=500;
 log('Seller','fermeture',`${x.s} fermé (${why}) P&L net ${f2(pnl)} €`);
 S.al.forEach(a=>{if(a.on&&a.s==x.s&&((a.ty=='sl'&&/stop/.test(why))||(a.ty=='tp'&&why=='take-profit')))fire(a,why+' exécuté, P&L '+f2(pnl)+' €')})}
/* Seller Engine */
function monitor(){[...S.pos].forEach(x=>{if(!fresh(x.s))return;if(agOf(x)=='opp')return oppMon(x);const p=M[x.s].p;x.hi=Math.max(x.hi,p);
 if(p>x.e*1.004)x.sl=Math.max(x.sl,x.hi*.997);
 if(p<=x.sl)close(x,x.sl>x.e?'trailing stop':'stop-loss',p);else if(p>=x.tp)close(x,'take-profit',p);
 else if(Date.now()-x.t>20*60000)close(x,'sortie temporelle 20 min',p);
 else{const i=ind(x.s);if(i&&SD[x.st]&&Date.now()-x.t>60000&&SD[x.st].x(i))close(x,'signal de sortie',p)}})}
/* Buyer Engine */
function buyer(a){const c=S.cfg,E=eq(),i=a.i,P=S.sp[a.st],p=M[a.s].p,sl=p-P.slM*i.a,tp=p+P.tpM*i.a,lim=a.st=='rev'?p-.3*i.a:0,ep=lim||p*(1+c.slip/100),f=c.fee/100,rpu=ep-sl+ep*(2*f+c.slip/100);
 let q=E*c.risk/100/rpu;const av=Math.max(0,E*c.budget/100*(1-S.pos.filter(x=>agOf(x)=='sc').length/c.maxPos)*(lossy('sc')?.5:1)-engaged('sc'));q=Math.min(q,av/(ep*(1+f)),E*.2/ep);
 return mkp(a.s,lim?'limit':'market',lim,sl,tp,q,a.st)}
/* AI Supervisor : toute proposition passe ici puis par le Risk Engine */
function supervise(p,xr){const ao=agOf(p)=='opp',Dd=ao?OD:D,t=p.st!='test',nm=ao?(OSD[p.st.slice(2)]||{n:p.st}).n:(SD[p.st]?SD[p.st].n:p.st);if(t)Dd.prop++;
 log(ao?'Opportunity':'Buyer','proposition',`${p.s} ${p.type} (${nm}) entrée ${f2(p.entry,4)} SL ${f2(p.sl,4)} TP ${f2(p.tp,4)} qté ${f2(p.q,5)} R/R net ${f2(p.rr)} · potentiel net ${f2(p.q*(p.tp-p.entry-p.entry*(2*S.cfg.fee/100+S.cfg.slip/100)))} €`);
 const R=risk(p);if(p.cost<10)R.push('montant < 10 €');if(xr)R.push(xr);
 if(R.length){log('Supervisor','refus',p.s+' refusé : '+R.join(', '));if(t){Dd.ref++;Dd.lr=R.join(', ');R.forEach(r=>{const k=r.replace(/[\d.,]+/g,'#');Dd.rej[k]=(Dd.rej[k]||0)+1})}order(p,R);return false}
 log('Risk','validation',p.s+' : risque '+f2(p.risk)+' € dans les limites');log('Supervisor','accord',p.s+' autorisé');if(t)Dd.acc++;order(p);return true}
/* AI Scalper Engine */
const WN={mom:(i,P)=>i.f<=i.m?'MA5≤MA20':!(i.r>P.rsiLo&&i.r<P.rsiHi)?'RSI '+f2(i.r,0)+' hors '+P.rsiLo+'-'+P.rsiHi:'MACD≤signal',
rev:(i,P)=>i.r>=P.rsiMax?'RSI '+f2(i.r,0)+' ≥ '+P.rsiMax:i.p>=i.bl?'prix > Bollinger basse':'pas de rebond',
trend:i=>!(i.p>i.m&&i.m>i.s50)?'pas de tendance haussière':'MACD≤signal',
brk:(i,P)=>i.p<=i.hh?'pas de cassure 20 min':'volume ×'+f2(i.vr)+' < '+P.vmin,
vol:(i,P)=>i.ar<P.vx?'ATR ×'+f2(i.ar)+' < '+P.vx:!(i.p>i.m)?'prix sous MA20':'MACD≤signal'};
function scState(){if(S.emerg)return'Arrêt d\'urgence';if(S.scalp=='stop')return'Arrêté';if(S.scalp=='pause')return'Suspendu'+(S.halt?' (limite atteinte)':'');
 if(!D.rc)return'Démarrage…';if(bad)return'Binance indisponible : en attente de données';if(Date.now()-D.t>45000)return'ALERTE : aucun cycle depuis '+Math.round((Date.now()-D.t)/1000)+' s';
 if(!SY.some(s=>ind(s)))return'Collecte de données (aucune donnée exploitable)';
 if(Date.now()-D.sigT<20000&&D.sig)return'Analyse : '+D.sig+' signal(s) en évaluation';return S.pos.length?'En position ('+S.pos.length+')':'En attente d\'un signal'}
function ST(k,d){const nf=SY.filter(s=>fresh(s)).length;if(S.emerg&&k!='Admin')return'Suspendu (arrêt d\'urgence)';
 if(k=='Analyst')return nf?`Actif · ${nf}/${SY.length} actifs à données fraîches`:'Inactif : aucune donnée fraîche';
 if(k=='Buyer'||k=='Supervisor')return (S.scalp=='run'||S.opp=='run')?'Actif (agents en marche)':'En veille (aucun agent démarré)';
 if(k=='Seller')return S.pos.length?`Actif · surveille ${S.pos.length} position(s)`:'En veille : aucune position';
 if(k=='Risk')return S.halt?'Blocage actif':'Prêt · contrôle chaque ordre';if(k=='Scalper')return scState();if(k=='Opportunity')return oppState();return d}
function scalper(){const now=Date.now(),c=S.cfg;
 if(S.emerg||S.halt||S.scalp!='run'){D.why=S.emerg?'arrêt d\'urgence actif':S.halt?'blocage : '+S.halt:'Scalper '+(S.scalp=='pause'?'suspendu':'arrêté')+' : aucune analyse';return}
 D.rc++;D.t=now;D.sym={};D.an=D.sig=0;const cand=[];

  why:OKY.filter(k=>S.ostrat[k]).map(k=>{let b=null;TFS.forEach(t=>{const o=OSD[k].c.filter(q=>q[1](I[t])).length;if(!b||o>b.o)b={o,t,m:OSD[k].c.find(q=>!q[1](I[t]))}});return OSD[k].n+' ('+TN[b.t]+' : manque '+(b.m?b.m[0]:'—')+')'}).join(' ; ')}}
function oppBuyer(a){const c=S.cfg,E=eq(),i=a.i,p=M[a.s].p,f=c.fee/100,ep=p*(1+c.slip/100),sl=Math.min(p-i.a,Math.max(i.ll-.1*i.a,p-3*i.a)),tp=p+OSD[a.k].t*(p-sl),rpu=ep-sl+ep*(2*f+c.slip/100);
 let q=E*c.risk/100/rpu;const av=Math.max(0,E*c.oppBudget/100*(lossy('opp')?.5:1)-engaged('opp'));q=Math.min(q,av/(ep*(1+f)),E*.2/ep);
 const r=mkp(a.s,'market',0,sl,tp,q,a.st);r.tf=a.tf;r.a=i.a;return r}
function oppCycle(){const now=Date.now(),c=S.cfg;
 if(S.emerg||S.halt||S.opp!='run'){OD.why=S.emerg?'arrêt d\'urgence actif':S.halt?'blocage : '+S.halt:'Opportunity Trader '+(S.opp=='pause'?'suspendu':'arrêté')+' : aucune analyse';return}
 OD.rc++;OD.t=now;OD.sym={};OD.an=OD.sig=0;
 SY.forEach(s=>{const a=oppAnalyse(s);if(a.err){OD.sym[s]=a.err;return}OD.an++;
  if(!a.best){OD.sym[s]='aucune opportunité : '+(a.why||'aucune stratégie active')+a.ctx;return}
  const b=a.best,nm=OSD[b.k].n+' '+TN[b.tf];OD.sig++;OD.tot++;OD.sigT=now;
  if(b.conf<c.oppMinScore)OD.sym[s]=`${nm} ignoré : score ${b.conf} < ${c.oppMinScore}`+a.ctx;
  else if(S.pos.some(y=>y.s==s)||S.ord.some(o=>o.s==s&&o.status=='open'))OD.sym[s]=nm+' : position ou ordre déjà ouvert';
  else if(now-(CO[s]||0)<c.oppCd*1000)OD.sym[s]=nm+' : délai anti-répétition';
  else{const p=oppBuyer(b);if(!(p.q>0)||!(p.sl<p.entry))OD.sym[s]=nm+' : taille nulle (budget ou risque épuisé)';
   else if(p.rr<c.oppMinRR)OD.sym[s]=`${nm} ignoré : R/R net ${f2(p.rr)} < ${c.oppMinRR} (frais et slippage inclus)`+a.ctx;
   else{CO[s]=now;OD.sym[s]=nm+' : proposition transmise au Supervisor';log('Opportunity','analyse',`${s} ${nm} score ${b.conf}, RSI ${f2(b.i.r,0)}, ATR ${f2(b.i.a/b.i.p*100,2)} %`);
    PQ.push({ag:'opp',p,conf:b.conf,cb:ok=>{OD.sym[s]=ok?nm+' : proposition acceptée → position ouverte':nm+' : refusée : '+OD.lr;if(!ok)OD.why='dernière proposition refusée : '+OD.lr}})}}});
 OD.why=PQ.some(x=>x.ag=='opp')?'':OD.an?(OD.sig?'opportunités présentes mais aucune éligible (voir motifs)':'aucune stratégie ne valide son entrée sur les 4 horizons : aucune transaction forcée'):'aucune donnée exploitable'}
/* AI Supervisor : arbitrage des deux agents (meilleur potentiel net ajusté du risque d'abord, un seul agent par actif) */
function arbitrate(){const q=PQ.splice(0);if(!q.length)return;q.sort((a,b)=>b.p.rr*b.conf-a.p.rr*a.conf);
 if(q.length>1)log('Supervisor','arbitrage','Priorité : '+q.map(y=>`${y.p.s} ${y.ag=='opp'?'Opportunity':'Scalper'} (R/R net ${f2(y.p.rr)} × score ${y.conf})`).join(' > '));
 const tk={};q.forEach(y=>{const ok=supervise(y.p,tk[y.p.s]?'conflit d\'actif : '+y.p.s+' déjà attribué à '+tk[y.p.s]:'');if(ok)tk[y.p.s]=y.ag=='opp'?'Opportunity Trader':'AI Scalper';y.cb(ok)})}
function partial(x,fr,why,px){const c=S.cfg,q=x.q*fr,ex=px*(1-c.slip/100),pr=q*ex,fee=pr*c.fee/100,bf=x.fee*fr,pnl=pr-fee-(q*x.e+bf);
 S.cash+=pr-fee;x.q-=q;x.fee-=bf;x.part=1;S.hist.unshift({t:Date.now(),s:x.s,q,e:x.e,x:ex,pnl,fees:bf+fee,why,st:x.st});if(S.hist.length>500)S.hist.length=500;
 log('Opportunity','fermeture',`${x.s} ${why} : ${f2(q,5)} vendu, P&L net ${f2(pnl)} € (frais ${f2(bf+fee)} €)`)}
function oppMon(x){const p=M[x.s].p,c=S.cfg,k=x.e*(2*c.fee/100+c.slip/100);x.hi=Math.max(x.hi,p);const R=x.r0||(x.r0=x.e-x.sl);
 if(p<=x.sl)return close(x,x.sl>x.e+k?'trailing stop':x.sl>=x.e?'stop au seuil de rentabilité':'stop-loss',p);
 if(p>=x.tp)return close(x,'take-profit',p);
 if(p>=x.e+R&&x.sl<x.e+k){x.sl=x.e+k;log('Opportunity','protection',`${x.s} stop remonté au seuil de rentabilité ${f2(x.sl,4)} €`)}
 if(p>=x.e+1.5*R&&!x.part&&x.q*p>=20)partial(x,.5,'vente partielle (+1,5 R)',p);
 if(x.part&&x.a){const t=x.hi-1.5*x.a;if(t>x.sl&&t<p)x.sl=t}
 const i=tfi(x.s,x.tf);if(i&&i.ct>x.t&&OSD[x.st.slice(2)].x(i))close(x,'conditions invalidées ('+TN[x.tf]+')',p)}
function oppState(){if(S.emerg)return'Arrêt d\'urgence';if(S.opp=='stop')return'Arrêté';if(S.opp=='pause')return'Suspendu'+(S.halt?' (limite atteinte)':'');
 if(!OD.rc)return'Démarrage…';if(bad)return'Binance indisponible : en attente de données';if(Date.now()-OD.t>45000)return'ALERTE : aucun cycle depuis '+Math.round((Date.now()-OD.t)/1000)+' s';
 if(!SY.some(s=>TFS.every(t=>freshT(s,t))))return'Collecte des bougies 5 min à 4 h';const n=S.pos.filter(x=>agOf(x)=='opp').length;return n?'En position ('+n+')':'En attente d\'une opportunité'}
function oppCard(){const st=stats(null,'opp'),ps=S.pos.filter(x=>agOf(x)=='opp'),unr=ps.reduce((t,x)=>t+(M[x.s]?(M[x.s].p-x.e)*x.q:0),0),cn=S.hist.filter(h=>agOf(h)=='opp'&&!/partielle/.test(h.why)).length;
 return`<div class="card"><div class="row" style="padding-top:0"><b>AI Opportunity Trader</b><b>${oppState()}</b></div><div class="sm g">Opportunités de quelques minutes à plusieurs heures. Simulation uniquement, aucun gain garanti.</div>${row('Horizons analysés',TFS.map(t=>TN[t]+(SY.some(s=>freshT(s,t))?' ✔':' …')).join(' · '))}${row('Actifs analysés (cycle)',OD.an+' / '+SY.length)}${row('Opportunités (cycle / cumul)',OD.sig+' / '+OD.tot)}${row('Propositions · acceptées · refusées',OD.prop+' · '+OD.acc+' · '+OD.ref)}${row('Positions ouvertes / clôturées',ps.length+' / '+cn)}${row('Gains / pertes réalisés',`<span class="up">${f2(st.sw)} €</span> / <span class="dn">${f2(st.sl)} €</span>`)}${row('Net réalisé',`<span class="${cl(st.net)}">${f2(st.net)} €</span>`)}${row('Latent',`<span class="${cl(unr)}">${f2(unr)} €</span>`)}<div class="sm" style="margin-top:6px"><b>Motif sans opportunité :</b> ${esc(OD.why||'—')}</div><div class="btns"><button data-a="oc" data-v="run">Démarrer AI Opportunity Trader</button><button class="s" data-a="oc" data-v="pause">Suspendre AI Opportunity Trader</button><button class="s" data-a="pg" data-v="opp">Détails</button></div></div>`}
function oppDiag(){const rs=Object.entries(OD.rej).sort((a,b)=>b[1]-a[1]),T=(S.testsO||[])[0];
 return`<div class="card"><b>Diagnostic Opportunity Trader</b> <span class="g sm">(compteurs depuis l'ouverture de la page)</span>${row('Cycles d\'analyse',OD.rc+(OD.t?' · dernier il y a '+Math.round((Date.now()-OD.t)/1000)+' s':''))}${row('Données fraîches par horizon',TFS.map(t=>TN[t]+' '+SY.filter(s=>freshT(s,t)).length+'/'+SY.length).join(' · '))}${HT.err?row('Alerte données',esc(HT.err)):''}${SY.map(s=>`<div class="row sm"><span>${s}</span><span class="g" style="text-align:right">${esc(OD.sym[s]||'—')}</span></div>`).join('')}${rs.length?'<div class="sm" style="margin-top:6px"><b>Motifs de refus (Supervisor / Risk Manager) :</b></div>'+rs.map(r=>`<div class="row sm"><span>${esc(r[0])}</span><b>${r[1]}</b></div>`).join(''):''}${OD.lr?'<div class="sm g">Dernier refus : '+esc(OD.lr)+'</div>':''}</div>
<div class="card"><div class="btns"><button data-a="selftestO">TEST DU MOTEUR OPPORTUNITY</button></div><div class="sm g">Exécute le moteur Opportunity sur un portefeuille isolé et des bougies fictives <b>TEST</b> : détection, ouverture, vente partielle, fermeture, frais, partage du capital, conflit, refus, pause/reprise, arrêt d'urgence. Rien n'est ajouté à votre cash, à l'historique ni aux statistiques.</div>${T?`<div class="row"><b>TEST · ${dt(T.t)}</b><b class="${T.ok?'up':'dn'}">${T.ok?'RÉUSSI':'ÉCHEC'}</b></div>`+T.R.map(r=>`<div class="row sm"><span>${r.ok?'✔':'✘'} ${esc(r.n)}</span><span class="g">${esc(r.d)}</span></div>`).join(''):''}</div>`}
PAGES.opp=()=>{const ps=S.pos.filter(x=>agOf(x)=='opp');return banners()+oppCard()+'<h2>Positions ouvertes</h2>'+(ps.map(x=>{const p=M[x.s]?M[x.s].p:x.e,pl=(p-x.e)*x.q;return`<div class="card"><div class="row" style="padding-top:0"><b>${x.s} · ${esc(OSD[x.st.slice(2)].n)} ${TN[x.tf]||''}</b><b class="${cl(pl)}">${f2(pl)} €</b></div><div class="sm g">Qté ${f2(x.q,5)} · entrée ${f2(x.e,4)} € · actuel ${f2(p,4)} €${x.part?' · 50 % déjà vendu':''}<br>SL ${f2(x.sl,4)} € · TP ${f2(x.tp,4)} € · ouverte ${dt(x.t)}</div><div class="btns"><button class="s" data-a="close" data-v="${x.id}">Fermer</button></div></div>`}).join('')||'<p class="g">Aucune position.</p>')+`<h2>Stratégies</h2><div class="card"><div class="btns">${OKY.map(k=>`<button class="${S.ostrat[k]?'':'s'}" data-a="ost" data-v="${k}">${OSD[k].n} : ${S.ostrat[k]?'actif':'inactif'}</button>`).join('')}</div><div class="sm g">Aucune fermeture sur simple durée : une position reste ouverte tant que ses protections ne sont pas touchées et que sa stratégie reste valide. Le stop ne descend jamais : il monte au seuil de rentabilité à +1 R, 50 % sont vendus à +1,5 R, puis le stop suit le plus haut.</div></div>`+oppDiag()+`<h2>Historique Opportunity</h2><div class="card">${S.hist.filter(h=>agOf(h)=='opp').slice(0,30).map(hrow).join('')||'<p class="g">Aucune opération.</p>'}</div>`};
ACT.oc=v=>{if(v=='run'&&(S.emerg||S.halt))return toast('Démarrage impossible : '+(S.emerg?'arrêt d\'urgence actif':S.halt));S.opp=v;if(v=='run'){OD.rc=0;OD.sym={};OD.why='démarrage en cours';HT.t=0}log('Opportunity','état','Opportunity Trader : '+AG.on[v]);done();if(v=='run')tick()};
ACT.ost=v=>{S.ostrat[v]=!S.ostrat[v];log('Admin','paramètre','stratégie Opportunity '+v+' = '+S.ostrat[v]);done()};
ACT.selftestO=()=>{selfTestO();done()};
function selfTestO(){const sv=S,mv=M,ov=OD,R=[],chk=(n,c,d)=>R.push({n,ok:!!c,d:d||''}),rst=()=>{S.cash=10000;S.pos=[];S.ord=[];S.hist=[]},now=()=>Date.now();
 try{S=JSON.parse(JSON.stringify(sv));OD=newOD();Object.assign(S,{log:[],al:[],emerg:false,halt:null,init:10000,peak:10000,dayStart:10000,scalp:'stop',opp:'stop',day:new Date().toDateString()});Object.assign(S.cfg,{fee:.1,slip:.05,risk:.25,minRR:1.2,oppMinRR:1.3,maxPos:5,oppMax:3,expMax:70,oppBudget:40,budget:40,stale:60});rst();
  const k=Array.from({length:120},(_,j)=>{const c=60+.2*j+.004*j*j;return{h:c*1.002,l:c*.998,c,v:j==119?300:100,ct:now()-(120-j)*36e5}}),L=k[119].c;
  M={TEST:{p:L,chg:0,vol:1e6,t:now()},TST2:{p:50,chg:0,vol:1e6,t:now()}};
  const i=ti(k,'TEST'),det=OKY.filter(q=>OSD[q].e(i)),a={s:'TEST',k:'trend',st:'o_trend',tf:'1h',i,conf:80},p=oppBuyer(a);
  chk('Détection d\'opportunité sur bougies fictives TEST',det.includes('trend'),det.map(q=>OSD[q].n).join(', '));
  chk('Proposition valide : SL < entrée < TP, R/R net',p.sl<p.entry&&p.entry<p.tp&&p.q>0&&p.rr>=S.cfg.oppMinRR,'SL '+f2(p.sl)+' · TP '+f2(p.tp)+' · R/R '+f2(p.rr));
  chk('Acceptée par Supervisor + Risk Manager, position Opportunity ouverte',supervise(p)&&S.pos.length==1&&agOf(S.pos[0])=='opp'&&S.pos[0].tf=='1h','risque '+f2(p.risk)+' €');
  const x=S.pos[0],e=x.e,Rr=e-x.sl,q=x.q,f0=x.fee,fe=.001,sg=.0005;
  chk('Cash débité (prix + frais)',Math.abs(S.cash-(10000-q*e-f0))<1e-6,'cash '+f2(S.cash)+' €');
  M.TEST.p=e+1.6*Rr;M.TEST.t=now();const P1=M.TEST.p,pp=q/2*P1*(1-sg)*(1-fe)-(q/2*e+f0/2);monitor();
  chk('Vente partielle de 50 % à +1,5 R, position conservée',S.pos.length==1&&Math.abs(S.pos[0].q-q/2)<1e-9&&/partielle/.test(S.hist[0].why),'');
  chk('Gain net de la vente partielle exact (frais et slippage)',Math.abs(S.hist[0].pnl-pp)<1e-6,'P&L '+f2(S.hist[0].pnl)+' € (attendu '+f2(pp)+')');
  chk('Stop remonté, jamais abaissé',x.sl>=e,'SL '+f2(x.sl)+' ≥ entrée '+f2(e));
  M.TEST.p=x.tp+1;M.TEST.t=now();const P2=M.TEST.p,pe=q/2*P2*(1-sg)*(1-fe)-(q/2*e+f0/2);monitor();
  chk('Take-profit sur le reste, position fermée',!S.pos.length&&S.hist[0].why=='take-profit','');
  chk('Gain net de la fermeture exact',Math.abs(S.hist[0].pnl-pe)<1e-6,'P&L '+f2(S.hist[0].pnl)+' € (attendu '+f2(pe)+')');
  chk('Cash = 10 000 + gains nets cumulés',Math.abs(S.cash-(10000+pp+pe))<1e-6,'cash '+f2(S.cash)+' €');
  rst();M.TEST.p=L;M.TEST.t=now();chk('Ordre trop risqué refusé par le Risk Manager',!supervise(mkp('TEST','market',0,L*.9,L*1.1,200,'o_trend')),S.log[0]?S.log[0].m:'');
  M.TEST.t=now()-1e6;chk('Donnée périmée refusée',!supervise(oppBuyer(a)),'');M.TEST.t=now();
  rst();const o1=supervise(oppBuyer(a)),o2=supervise(mkp('TST2','market',0,49,52,20,'test'));
  chk('Capital partagé, jamais compté deux fois',o1&&o2&&Math.abs(S.cash+engaged()+S.pos.reduce((t,y)=>t+y.fee,0)-10000)<1e-6&&Math.abs(engaged('opp')+engaged('sc')-engaged())<1e-9&&agOf(S.pos[0])!=agOf(S.pos[1]),'engagé Opportunity '+f2(engaged('opp'))+' € · Scalper '+f2(engaged('sc'))+' €');
  rst();PQ.length=0;let r1,r2;PQ.push({ag:'sc',p:mkp('TEST','market',0,L*.98,L*1.05,5,'test'),conf:70,cb:ok=>r1=ok},{ag:'opp',p:oppBuyer(a),conf:80,cb:ok=>r2=ok});arbitrate();
  chk('Conflit sur un actif : un seul agent servi, l\'autre refusé par le Supervisor',S.pos.length==1&&r1!==r2&&S.log.some(l=>l.a=='Supervisor'&&/conflit/.test(l.m)),(r2?'Opportunity':'Scalper')+' prioritaire');
  rst();S.scalp='run';S.opp='pause';oppCycle();chk('Suspension d\'Opportunity sans toucher au Scalper',/suspendu/.test(OD.why)&&S.scalp=='run',OD.why);
  const rc=OD.rc;S.scalp='pause';S.opp='run';oppCycle();chk('Reprise d\'Opportunity pendant que le Scalper reste suspendu',OD.rc==rc+1&&S.scalp=='pause','cycle '+OD.rc);
  S.emerg=true;chk('Arrêt d\'urgence : les deux agents refusés',!supervise(oppBuyer(a))&&!supervise(mkp('TEST','market',0,L*.98,L*1.05,5,'test')),'')}
 catch(e){chk('Exécution du test',false,e.message)}finally{S=sv;M=mv;OD=ov}
 (S.testsO=S.testsO||[]).unshift({t:Date.now(),ok:R.every(r=>r.ok),R});S.testsO.length=Math.min(S.testsO.length,3)}

head();render();tick();if(!window.TM)window.TM=setInterval(tick,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
