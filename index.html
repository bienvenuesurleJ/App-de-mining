<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070B">
<title>AI Trading Central — BlackBlue</title>
<style>
:root{--k:#05070B;--k2:#0A0F18;--n:#101C32;--b:#1677FF;--bl:#32A8FF;--w:#F5F8FF;--g:#8491A5;--ok:#2ecc8f;--ko:#ff5c6c}
*{box-sizing:border-box;margin:0}
body{background:var(--k);color:var(--w);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(66px + env(safe-area-inset-bottom));overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:#05070Bee;backdrop-filter:blur(8px);border-bottom:1px solid #1677ff33;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:1rem;flex:1;min-width:140px}header h1 span{color:var(--bl)}
main{padding:12px;max-width:1100px;margin:auto}
h2{font-size:1.05rem;margin:14px 0 8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:linear-gradient(var(--k2),var(--n));border:1px solid #1677ff33;border-radius:12px;padding:12px;box-shadow:0 0 18px #1677ff12;margin-bottom:10px}
.grid>.card{margin:0}
.big{font-size:1.35rem;font-weight:700}.g{color:var(--g)}.up{color:var(--ok)}.dn{color:var(--ko)}.sm{font-size:.82rem}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #1677ff22}
.row:last-child{border:0}
button,select,input{font:inherit;min-height:44px;border-radius:10px}
button{background:var(--b);color:#fff;border:0;padding:10px 14px}
button.s{background:#1677ff22;border:1px solid #1677ff66}button.d{background:#b3261e}
select,input{background:var(--k);color:var(--w);border:1px solid #1677ff66;padding:8px;width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.warn{background:#3a2a00;border:1px solid #b88a00;border-radius:10px;padding:10px;margin-bottom:10px}
.bad{background:#3a0f14;border:1px solid var(--ko);border-radius:10px;padding:10px;margin-bottom:10px}
label{display:block;margin:10px 0 2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;overflow-x:auto;background:var(--k2);border-top:1px solid #1677ff55;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:0 0 auto;min-width:78px;background:none;border-radius:0;color:var(--g);padding:12px 8px}
nav button.on{color:var(--w);box-shadow:inset 0 -3px var(--bl)}
#toast{position:fixed;left:12px;right:12px;bottom:80px;z-index:9;background:var(--n);border:1px solid var(--bl);border-radius:10px;padding:10px;display:none}
@media(min-width:900px){body{padding:0 0 0 180px}nav{top:0;bottom:auto;width:180px;height:100%;flex-direction:column;border-top:0;border-right:1px solid #1677ff55;padding-top:60px}nav button{text-align:left;padding:14px}nav button.on{box-shadow:inset 3px 0 var(--bl)}#toast{left:auto;width:360px;bottom:20px}}
</style></head><body>
<header></header><nav></nav><main></main><div id="toast"></div>
<noscript>JavaScript est nécessaire.</noscript>
<script>
/* ===== Core / Storage ===== */
const $=s=>document.querySelector(s),f2=(x,d=2)=>Number(x).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}),
esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),cl=x=>x>=0?'up':'dn',
dt=t=>new Date(t).toLocaleString('fr-FR'),SY=['BTC','ETH','SOL','XRP','BNB','ADA','DOGE'];
const DEF=()=>({cash:10000,init:10000,pos:[],hist:[],log:[],eq:[],peak:10000,dayStart:10000,day:new Date().toDateString(),emerg:false,halt:null,scalp:'stop',strat:{mom:true,rev:true,trend:true,brk:true,vol:true},ord:[],al:[],stk:{url:''},sp:{mom:{rsiLo:52,rsiHi:68,slM:1.5,tpM:2.5},rev:{rsiMax:30,slM:1.5,tpM:2},trend:{slM:2,tpM:4},brk:{vmin:1.5,slM:1.5,tpM:3},vol:{vx:1.6,slM:1.5,tpM:3}},n:0,
cfg:{risk:.25,dayLoss:1,dd:5,maxPos:5,fee:.1,slip:.05,stale:60,budget:40,cd:60,minScore:60,minRR:1.2,maxHr:12,ordMin:10}});
function load(){try{const o=JSON.parse(localStorage.getItem('atc_v1'));if(o)return merge(o);}catch(e){}return null}
function merge(o){const d=DEF();return Object.assign(d,o,{cfg:Object.assign(d.cfg,o.cfg),sp:Object.assign(d.sp,o.sp),strat:Object.assign(d.strat,o.strat)})}
function save(){try{localStorage.setItem('atc_v1',JSON.stringify(S))}catch(e){}}
let S=load()||DEF(),M={},H={},FX=0,page='dash',NEWS=null,BTR=null,BTS='BTC',LF='',CAP=S.init,bad=null,CD={},lastOk=0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',5000)}
/* Audit Engine */
function log(a,ty,m){S.log.unshift({t:Date.now(),a,ty,m});if(S.log.length>400)S.log.length=400;if(ty=='alerte')toast(m)}
/* ===== Market Data Engine (Binance : tickers + bougies 1 min OHLCV) ===== */
const BS=['https://data-api.binance.vision','https://api.binance.com'];
async function bj(p){for(const b of BS){try{const r=await fetch(b+p);if(r.ok)return await r.json()}catch(e){}}throw new Error('indisponible')}
let K={};
async function pull(){try{
 const d=await bj('/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify([...SY.map(s=>s+'USDT'),'EURUSDT'])));
 const fx=+d.find(x=>x.symbol=='EURUSDT').lastPrice;if(!(fx>0))throw 0;FX=fx;const now=Date.now();
 d.forEach(x=>{const s=x.symbol.replace('USDT','');if(s!='EUR')M[s]={p:+x.lastPrice/FX,chg:+x.priceChangePercent,vol:+x.quoteVolume/FX,t:now}});
 await Promise.all(SY.map(async s=>{try{const k=(await bj('/api/v3/klines?symbol='+s+'USDT&interval=1m&limit=120')).map(x=>({h:+x[2]/FX,l:+x[3]/FX,c:+x[4]/FX,v:+x[5]}));k.t=now;K[s]=k;H[s]=k.map(x=>x.c)}catch(e){}}));
 bad=null;lastOk=now}catch(e){bad='Données de marché indisponibles : aucune opération ne peut être ouverte tant que la connexion à Binance ne revient pas.'}}
const fresh=s=>M[s]&&Date.now()-M[s].t<S.cfg.stale*1000;
/* ===== Indicateurs & Analyst Engine ===== */
const sma=(a,n)=>a.slice(-n).reduce((x,y)=>x+y,0)/n,ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(x=>e=x*k+e*(1-k))},
sd=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)};
function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}return l==0?100:100-100/(1+g/l)}
function atr(k,n){let t=0;for(let i=k.length-n;i<k.length;i++)t+=Math.max(k[i].h-k[i].l,Math.abs(k[i].h-k[i-1].c),Math.abs(k[i].l-k[i-1].c));return t/n}
function ind(s){const k=K[s];if(!k||k.length<60||!fresh(s)||Date.now()-k.t>S.cfg.stale*1000)return null;
 const c=H[s],n=c.length,e12=ema(c,12),e26=ema(c,26),ml=e12.map((x,j)=>x-e26[j]),sg=ema(ml,9),m=sma(c,20),b=sd(c.slice(-20)),pv=k.slice(-22,-2);
 return{p:M[s].p,pc:c[n-2],r:rsi(c),f:sma(c,5),m,s50:sma(c,50),mh:ml[n-1]-sg[n-1],bu:m+2*b,bl:m-2*b,a:atr(k,14),ar:atr(k,5)/atr(k,30),vr:k[n-2].v/(pv.reduce((t,x)=>t+x.v,0)/20),hh:Math.max(...k.slice(-21,-1).map(x=>x.h))}}
const SD={
mom:{n:'Momentum',d:'Entrée : MA5>MA20, RSI dans la fourchette, MACD>signal. Sortie : MA5<MA20, stop ATR ou objectif ATR.',e:(i,P)=>i.f>i.m&&i.r>P.rsiLo&&i.r<P.rsiHi&&i.mh>0,x:i=>i.f<i.m},
rev:{n:'Mean Reversion',d:'Entrée (ordre limite sous le marché) : RSI en survente, prix sous la bande de Bollinger basse, bougie de rebond. Sortie : retour à la moyenne.',e:(i,P)=>i.r<P.rsiMax&&i.p<i.bl&&i.p>i.pc,x:i=>i.p>=i.m},
trend:{n:'Trend Following',d:'Entrée : prix>MA20>MA50 et MACD>signal. Sortie : prix<MA50.',e:i=>i.p>i.m&&i.m>i.s50&&i.mh>0,x:i=>i.p<i.s50},
brk:{n:'Breakout',d:'Entrée : cassure du plus haut des 20 dernières minutes avec volume au-dessus du seuil. Sortie : prix<MA20.',e:(i,P)=>i.p>i.hh&&i.vr>=P.vmin,x:i=>i.p<i.m},
vol:{n:'Trading de volatilité',d:'Entrée : expansion de la volatilité ATR(5)/ATR(30) au-dessus du seuil, prix>MA20, MACD>signal. Sortie : prix<MA20.',e:(i,P)=>i.ar>=P.vx&&i.p>i.m&&i.mh>0,x:i=>i.p<i.m}};
function analyse(s){const i=ind(s);if(!i)return{s,n:(H[s]||[]).length,sig:null};let b=null;
 for(const k in SD)if(S.strat[k]&&SD[k].e(i,S.sp[k])){const c=Math.min(95,50+(i.mh>0?15:0)+(i.vr>1.2?15:0)+(i.p>i.s50?15:0));if(!b||c>b.conf)b={st:k,conf:c}}
 return{s,n:H[s].length,i,r:i.r,f:i.f,m:i.m,p:i.p,sig:b?SD[b.st].n:null,st:b&&b.st,conf:b?b.conf:0}}
/* ===== Portfolio / Risk Engine ===== */
const eq=()=>S.cash+S.pos.reduce((t,x)=>t+x.q*(M[x.s]?M[x.s].p:x.e),0),engaged=()=>S.pos.reduce((t,x)=>t+x.q*x.e,0),
lossy=()=>S.hist.length>=3&&S.hist.slice(0,3).every(h=>h.pnl<0),
reserved=()=>S.ord.filter(o=>o.status=='open').reduce((t,o)=>t+(o.q-o.filled)*o.lim*(1+S.cfg.fee/100),0);
function risk(p){const c=S.cfg,E=eq(),R=[];
 if(S.emerg)R.push('arrêt d\'urgence actif');if(S.halt)R.push('limite atteinte : '+S.halt);
 if(!fresh(p.s))R.push('donnée périmée ou absente');
 if(!(p.q>0)||!(p.sl<p.entry&&p.entry<p.tp))R.push('paramètres d\'ordre invalides');
 if(p.type=='limit'&&fresh(p.s)&&p.lim>=M[p.s].p)R.push('limite d\'achat au-dessus du marché');
 if(S.pos.length+S.ord.filter(o=>o.status=='open').length>=c.maxPos)R.push('nombre max de positions/ordres atteint');
 if(S.pos.some(x=>x.s==p.s)||S.ord.some(o=>o.s==p.s&&o.status=='open'))R.push('position ou ordre déjà ouvert sur '+p.s);
 if(p.risk>E*c.risk/100*1.001)R.push('risque '+f2(p.risk)+' € > limite '+f2(E*c.risk/100)+' €');
 if(p.cost>E*.25)R.push('exposition par actif > 25 %');
 if(p.cost+p.fee>S.cash-reserved())R.push('cash insuffisant');
 if(p.rr<c.minRR)R.push('rendement/risque net '+f2(p.rr)+' < '+c.minRR+' (frais et slippage inclus)');
 return R}
function limits(){const E=eq(),c=S.cfg;if(S.day!=new Date().toDateString()){S.day=new Date().toDateString();S.dayStart=E;if(S.halt&&S.halt.startsWith('perte'))S.halt=null}
 S.peak=Math.max(S.peak,E);if(S.halt)return;const dl=(E-S.dayStart)/S.dayStart*100,dd=(S.peak-E)/S.peak*100;
 if(dl<=-c.dayLoss)stop('perte journalière '+f2(dl)+' % (limite '+c.dayLoss+' %)');else if(dd>=c.dd)stop('drawdown '+f2(dd)+' % (limite '+c.dd+' %)')}
function stop(m){S.halt=m;if(S.scalp=='run')S.scalp='pause';log('Risk','alerte','Blocage automatique : '+m+'. Nouvelles opérations bloquées, Scalper suspendu.')}
/* ===== Simulation Engine : ordres marché / limite, exécutions partielles ===== */
function mkp(s,type,lim,sl,tp,q,st){const c=S.cfg,pr=M[s].p,f=c.fee/100,entry=type=='limit'?lim:pr*(1+c.slip/100),cost=q*entry,k=entry*(2*f+c.slip/100),rpu=entry-sl+k;
 return{s,type,lim,entry,sl,tp,q,cost,fee:cost*f,risk:q*rpu,rr:rpu>0?(tp-entry-k)/rpu:0,st}}
function order(p,R){const o={id:++S.n,s:p.s,type:p.type,lim:p.lim,entry:p.entry,q:p.q,filled:0,sl:p.sl,tp:p.tp,st:p.st,t:Date.now(),status:R?'rejected':'open',why:R?R.join(', '):''};
 S.ord.unshift(o);if(S.ord.length>200)S.ord.length=200;
 if(!R&&p.type=='market')fill(o,p.q,p.entry);else if(!R)log('Simulation','ordre',`Ordre limite ${o.id} ${p.s} @ ${f2(p.lim,4)} € en attente`)}
function fill(o,q,px){const fee=q*px*S.cfg.fee/100;S.cash-=q*px+fee;let x=S.pos.find(p=>p.oid==o.id);
 if(x){x.e=(x.e*x.q+px*q)/(x.q+q);x.q+=q;x.fee+=fee;x.hi=Math.max(x.hi,px)}else S.pos.push({id:++S.n,oid:o.id,s:o.s,q,e:px,sl:o.sl,tp:o.tp,hi:px,fee,t:Date.now(),st:o.st});
 o.filled+=q;if(o.q-o.filled<=o.q*1e-9)o.status='filled';log('Simulation','exécution',`${o.status=='filled'?'Exécution':'Exécution partielle'} ${o.s} ${f2(q,5)} @ ${f2(px,4)} € (frais ${f2(fee)} €)`)}
function orders(){const now=Date.now();S.ord.filter(o=>o.status=='open').forEach(o=>{
 if(now-o.t>S.cfg.ordMin*60000){o.status='cancelled';o.why='expiré';log('Simulation','ordre','Ordre '+o.id+' expiré');return}
 if(S.emerg||S.halt||!fresh(o.s))return;if(M[o.s].p<=o.lim){const r=o.q-o.filled;fill(o,r*.5*o.lim<10?r:r*.5,o.lim)}})}
function cancelAll(){S.ord.forEach(o=>{if(o.status=='open'){o.status='cancelled';o.why='arrêt d\'urgence'}})}
function close(x,why,px){const c=S.cfg,ex=px*(1-c.slip/100),pr=x.q*ex,fee=pr*c.fee/100,pnl=pr-fee-(x.q*x.e+x.fee);
 S.cash+=pr-fee;S.pos=S.pos.filter(p=>p.id!=x.id);S.hist.unshift({t:Date.now(),s:x.s,q:x.q,e:x.e,x:ex,pnl,fees:x.fee+fee,why,st:x.st});if(S.hist.length>500)S.hist.length=500;
 log('Seller','fermeture',`${x.s} fermé (${why}) P&L net ${f2(pnl)} €`);
 S.al.forEach(a=>{if(a.on&&a.s==x.s&&((a.ty=='sl'&&/stop/.test(why))||(a.ty=='tp'&&why=='take-profit')))fire(a,why+' exécuté, P&L '+f2(pnl)+' €')})}
/* Seller Engine */
function monitor(){[...S.pos].forEach(x=>{if(!fresh(x.s))return;const p=M[x.s].p;x.hi=Math.max(x.hi,p);
 if(p>x.e*1.004)x.sl=Math.max(x.sl,x.hi*.997);
 if(p<=x.sl)close(x,x.sl>x.e?'trailing stop':'stop-loss',p);else if(p>=x.tp)close(x,'take-profit',p);
 else if(Date.now()-x.t>20*60000)close(x,'sortie temporelle 20 min',p);
 else{const i=ind(x.s);if(i&&SD[x.st]&&Date.now()-x.t>60000&&SD[x.st].x(i))close(x,'signal de sortie',p)}})}
/* Buyer Engine */
function buyer(a){const c=S.cfg,E=eq(),i=a.i,P=S.sp[a.st],p=M[a.s].p,sl=p-P.slM*i.a,tp=p+P.tpM*i.a,lim=a.st=='rev'?p-.3*i.a:0,ep=lim||p*(1+c.slip/100),f=c.fee/100,rpu=ep-sl+ep*(2*f+c.slip/100);
 let q=E*c.risk/100/rpu;const av=Math.max(0,E*c.budget/100*(1-S.pos.length/c.maxPos)*(lossy()?.5:1)-engaged());q=Math.min(q,av/(ep*(1+f)),E*.2/ep);
 return mkp(a.s,lim?'limit':'market',lim,sl,tp,q,a.st)}
/* AI Supervisor : toute proposition passe ici puis par le Risk Engine */
function supervise(p){log('Buyer','proposition',`${p.s} ${p.type} (${SD[p.st]?SD[p.st].n:p.st}) entrée ${f2(p.entry,4)} SL ${f2(p.sl,4)} TP ${f2(p.tp,4)} qté ${f2(p.q,5)} R/R net ${f2(p.rr)}`);
 const R=risk(p);if(p.cost<10)R.push('montant < 10 €');
 if(R.length){log('Supervisor','refus',p.s+' refusé : '+R.join(', '));order(p,R);return false}
 log('Risk','validation',p.s+' : risque '+f2(p.risk)+' € dans les limites');log('Supervisor','accord',p.s+' autorisé');order(p);return true}
/* AI Scalper Engine */
function scalper(){if(S.scalp!='run'||S.emerg||S.halt)return;const now=Date.now();
 if(S.hist.filter(h=>now-h.t<36e5).length+S.pos.length>=S.cfg.maxHr)return;
 const L=SY.map(analyse).filter(a=>a.sig&&a.conf>=S.cfg.minScore&&!S.pos.some(x=>x.s==a.s)&&!S.ord.some(o=>o.s==a.s&&o.status=='open')).sort((a,b)=>b.conf-a.conf),
 ok=L.filter(a=>{const h=S.hist.find(x=>x.s==a.s);return now-(CD[a.s]||0)>S.cfg.cd*(h&&h.pnl<0&&now-h.t<9e5?3:1)*1000});
 if(!ok.length){if(now-(scalper.w||0)>3e5){scalper.w=now;log('Scalper','attente',L.length?'Signaux en délai de protection anti-répétition':'Aucun signal valide sur '+SY.length+' actifs : aucune transaction forcée')}return}
 ok.forEach(a=>{CD[a.s]=now;log('Analyst','analyse',`${a.s} ${a.sig} score ${a.conf}, RSI ${f2(a.r,0)}, MACD ${a.i.mh>0?'+':'−'}, vol ×${f2(a.i.vr)}, ATR ${f2(a.i.a/a.p*100,2)} %`);supervise(buyer(a))})}
/* ===== Alert Engine ===== */
const AT={up:'Prix ≥ (€)',dn:'Prix ≤ (€)',chg:'Variation 24 h ≥ (%)',vol:'Volatilité ATR ≥ (% du prix)',buy:'Signal d\'achat',sell:'Signal de sortie (position ouverte)',sl:'Stop-loss touché',tp:'Take-profit touché'};
function fire(a,m){a.last=Date.now();log('Alertes','alerte',a.s+' : '+m)}
function alerts(){const now=Date.now();S.al.forEach(a=>{if(!a.on||now-(a.last||0)<3e5||!fresh(a.s))return;const m=M[a.s],i=ind(a.s);
 if(a.ty=='up'&&m.p>=a.v)fire(a,'prix '+f2(m.p,4)+' € ≥ '+a.v);else if(a.ty=='dn'&&m.p<=a.v)fire(a,'prix '+f2(m.p,4)+' € ≤ '+a.v);
 else if(a.ty=='chg'&&Math.abs(m.chg)>=a.v)fire(a,'variation 24 h '+f2(m.chg)+' %');
 else if(a.ty=='vol'&&i&&i.a/i.p*100>=a.v)fire(a,'volatilité ATR '+f2(i.a/i.p*100,3)+' %');
 else if(a.ty=='buy'){const g=analyse(a.s);if(g.sig)fire(a,'signal '+g.sig+' (score '+g.conf+')')}
 else if(a.ty=='sell'){const x=S.pos.find(p=>p.s==a.s);if(x&&i&&SD[x.st]&&SD[x.st].x(i))fire(a,'signal de sortie sur position ouverte')}})}
async function tick(){if(tick.b)return;tick.b=1;try{await pull();orders();monitor();limits();alerts();scalper();S.eq.push([Date.now(),eq()]);if(S.eq.length>500)S.eq.shift();save();head();if(!['set','bt','ord','alerts','stk','strat'].includes(page))render()}finally{tick.b=0}}
/* ===== UI ===== */
const AG={on:{run:'En marche',pause:'Suspendu',stop:'Arrêté'}};
const PG=[['dash','Accueil'],['agents','Agents'],['port','Portefeuille'],['set','Réglages'],['scalp','Scalper'],['mkts','Marchés'],['news','Actus'],['strat','Stratégies'],['ord','Ordres'],['alerts','Alertes'],['stk','Actions'],['bt','Backtest'],['log','Journal']];
function head(){const E=eq();$('header').innerHTML=`<h1>AI Trading Central <span>BlackBlue</span></h1><b>${f2(E)} €</b><span class="${cl(E-S.init)} sm">${f2((E-S.init)/S.init*100)} %</span><button class="${S.emerg?'s':'d'}" data-a="em">${S.emerg?'Lever l\'arrêt':'Arrêt d\'urgence'}</button>`;
 $('nav').innerHTML=PG.map(p=>`<button class="${p[0]==page?'on':''}" data-a="pg" data-v="${p[0]}">${p[1]}</button>`).join('')}
const row=(l,v)=>`<div class="row"><span class="g">${l}</span><b>${v}</b></div>`,card=(l,v,c='')=>`<div class="card"><div class="g sm">${l}</div><div class="big ${c}">${v}</div></div>`;
function chart(a){if(a.length<2)return'<p class="g">Courbe en construction (un point toutes les 10 s).</p>';const w=600,h=150,v=a.map(x=>x[1]),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;

function bt(c,f,s,fee,slip,cap){let cash=cap,q=0,ent=0,eqs=[],tr=[];const m=(i,n)=>{let t=0;for(let k=i-n+1;k<=i;k++)t+=c[k];return t/n};
 for(let i=s+1;i<c.length;i++){const up=m(i-1,f)>m(i-1,s);
  if(up&&!q){const px=c[i]*(1+slip);q=cash/(px*(1+fee));cash-=q*px*(1+fee);ent=px*(1+fee)}
  else if(!up&&q){const px=c[i]*(1-slip),v=q*px*(1-fee);tr.push(v-q*ent);cash+=v;q=0}
  eqs.push(cash+q*c[i])}
 if(q){const v=q*c[c.length-1]*(1-slip)*(1-fee);tr.push(v-q*ent);cash+=v;eqs[eqs.length-1]=cash}
 const w=tr.filter(x=>x>0),l=tr.filter(x=>x<=0),sw=w.reduce((a,b)=>a+b,0),sl=-l.reduce((a,b)=>a+b,0);let pk=cap,dd=0;eqs.forEach(v=>{pk=Math.max(pk,v);dd=Math.max(dd,(pk-v)/pk*100)});
 return{ret:(cash/cap-1)*100,n:tr.length,wr:tr.length?w.length/tr.length*100:0,pf:sl?sw/sl:(sw?Infinity:0),dd,aw:w.length?sw/w.length:0,al:l.length?-sl/l.length:0}}

let STK=null;
PAGES.strat=()=>banners()+Object.keys(SD).map(k=>{const st=stats(k),P=S.sp[k];return`<div class="card"><div class="row" style="padding-top:0"><b>${SD[k].n}</b><button class="${S.strat[k]?'':'s'}" data-a="st" data-v="${k}">${S.strat[k]?'Actif':'Inactif'}</button></div><div class="sm g">${SD[k].d}</div>${Object.keys(P).map(q=>`<label class="sm">${PL[q]||q}</label><input type="number" step="any" data-p="${k}.${q}" value="${P[q]}">`).join('')}<div class="sm" style="margin-top:8px">${st.n} opérations · réussite ${f2(st.wr,0)} % · net <span class="${cl(st.net)}">${f2(st.net)} €</span> · frais ${f2(st.fees)} €</div></div>`}).join('')+'<p class="g sm">Score d\'un signal = 50 + 15 par confirmation (MACD>signal, volume>1,2× la moyenne, prix>MA50) : ce n\'est pas une probabilité de gain. Aucune stratégie n\'est présentée comme rentable ; seules les statistiques de votre simulation comptent.</p>';
PAGES.ord=()=>banners()+`<div class="card"><b>Nouvel ordre d'achat simulé</b><label>Actif</label>${symSel('o_s')}<label>Type</label><select id="o_t"><option value="market">Marché</option><option value="limit">Limite</option></select><label>Montant (€)</label><input id="o_a" type="number" value="500"><label>Prix limite (€, ordre limite)</label><input id="o_l" type="number" step="any"><label>Stop-loss (%)</label><input id="o_sl" type="number" value="1" step="any"><label>Take-profit (%)</label><input id="o_tp" type="number" value="1.5" step="any"><div class="btns"><button data-a="ord">Soumettre au Supervisor</button></div><div class="sm g">Passe par le Supervisor et le Risk Engine comme tout ordre. Un ordre limite s'exécute par fractions (50 % du reste toutes les 10 s tant que le prix est ≤ limite) et expire après ${S.cfg.ordMin} min.</div></div><h2>Ordres en attente</h2>`+(S.ord.filter(o=>o.status=='open').map(o=>`<div class="card"><div class="row" style="padding-top:0"><b>${o.s} limite @ ${f2(o.lim,4)} €</b><button class="s" data-a="ocx" data-v="${o.id}">Annuler</button></div><div class="sm g">exécuté ${f2(o.filled,5)} / ${f2(o.q,5)}</div></div>`).join('')||'<p class="g">Aucun.</p>')+`<h2>Historique des ordres</h2><div class="card">${S.ord.filter(o=>o.status!='open').slice(0,30).map(o=>`<div class="row sm"><span>${o.s} ${o.type} · ${OS[o.status]}${o.why?' ('+esc(o.why)+')':''}</span><span class="g">${dt(o.t)}</span></div>`).join('')||'<p class="g">Aucun.</p>'}</div>`;
ACT.ord=()=>{const s=$('#o_s').value,m=M[s];if(!m)return toast('Prix indisponible');const ty=$('#o_t').value,lim=+$('#o_l').value,f=S.cfg.fee/100,ep=ty=='limit'?lim:m.p*(1+S.cfg.slip/100),am=+$('#o_a').value;
 if(!(ep>0&&am>0))return toast('Prix limite ou montant invalide');supervise(mkp(s,ty,lim,ep*(1-$('#o_sl').value/100),ep*(1+$('#o_tp').value/100),am/ep/(1+f),'manuel'));done()};
ACT.ocx=v=>{const o=S.ord.find(x=>x.id==v);if(o&&o.status=='open'){o.status='cancelled';o.why='annulé par l\'administrateur';log('Admin','ordre','Ordre '+v+' annulé');done()}};
PAGES.alerts=()=>`<div class="card"><label>Actif</label>${symSel('a_s')}<label>Type</label><select id="a_t">${Object.keys(AT).map(k=>`<option value="${k}">${AT[k]}</option>`).join('')}</select><label>Valeur (types avec seuil)</label><input id="a_v" type="number" step="any"><div class="btns"><button data-a="aadd">Ajouter l'alerte</button></div><div class="sm g">Évaluées toutes les 10 s uniquement quand l'application est ouverte ; notification dans l'application et dans le Journal.</div></div>`+(S.al.map(a=>`<div class="card"><div class="row" style="padding-top:0"><b>${a.s} · ${AT[a.ty]} ${a.v||''}</b><span><button class="s" data-a="atg" data-v="${a.id}">${a.on?'Active':'Inactive'}</button> <button class="d" data-a="adel" data-v="${a.id}">Suppr.</button></span></div></div>`).join('')||'<p class="g">Aucune alerte.</p>');
ACT.aadd=()=>{const ty=$('#a_t').value,v=+$('#a_v').value;if(['up','dn','chg','vol'].includes(ty)&&!(v>0))return toast('Valeur requise');S.al.push({id:++S.n,s:$('#a_s').value,ty,v:['up','dn','chg','vol'].includes(ty)?v:0,on:true});done()};
ACT.atg=v=>{const a=S.al.find(x=>x.id==v);if(a)a.on=!a.on;done()};ACT.adel=v=>{S.al=S.al.filter(x=>x.id!=v);done()};
PAGES.stk=()=>{const ok=Array.isArray(STK);return`<div class="${ok?'card':'warn'}"><b>Statut : ${ok?'connecté (lecture seule)':'non connecté'}</b><div class="sm g" style="margin-top:6px">Aucune donnée d'actions ou d'ETF n'est affichée sans source réelle. Aucun ordre n'est possible sur les actions dans cette version. Ne saisissez jamais de clé API ici : elle doit rester sur votre propre backend ou proxy (par ex. une fonction cloud), dont vous indiquez l'URL HTTPS. Il doit répondre à <code>?symbols=AAPL,MSFT</code> par un JSON <code>[{"symbol","price","time"(ms)}]</code>.</div></div><div class="card"><label>URL du proxy de données</label><input id="stu" type="url" placeholder="https://…" value="${esc(S.stk.url)}"><div class="btns"><button data-a="stk">Tester la connexion</button></div></div>`+(STK=='load'?'<p class="g">Test…</p>':STK=='err'?'<div class="bad">Connexion échouée ou réponse invalide : actions non connectées.</div>':ok?`<div class="card">${STK.map(x=>`<div class="row"><b>${esc(x.symbol)}</b><span>${f2(x.price)} · ${dt(x.time)}${Date.now()-x.time>9e5?' · <span class=dn>périmée</span>':''}</span></div>`).join('')}<div class="sm g">Source : ${esc(new URL(S.stk.url).host)} · données possiblement différées</div></div>`:'')};
ACT.stk=async()=>{if(!/^https:\/\//.test(S.stk.url))return toast('URL HTTPS requise');STK='load';render();try{const j=await(await fetch(S.stk.url+(S.stk.url.includes('?')?'&':'?')+'symbols=AAPL,MSFT,SPY')).json();if(!Array.isArray(j)||!j.length||j.some(x=>!x.symbol||!(x.price>0)||!(x.time>0)))throw 0;STK=j}catch(e){STK='err'}render()};
/* Start */
head();render();tick();setInterval(tick,10000);
</script></body></html>
