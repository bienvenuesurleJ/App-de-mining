<script>
/* ===== Core / Storage ===== */
const $=s=>document.querySelector(s),f2=(x,d=2)=>Number(x).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}),
esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),cl=x=>x>=0?'up':'dn',
dt=t=>new Date(t).toLocaleString('fr-FR'),SY=['BTC','ETH','SOL','XRP','BNB','ADA','DOGE'];
const DEF=()=>({cash:10000,init:10000,pos:[],hist:[],log:[],eq:[],peak:10000,dayStart:10000,day:new Date().toDateString(),emerg:false,halt:null,scalp:'stop',opp:'stop',ostrat:{trend:true,brk:true,pull:true,rev:true,mom:true,rvs:true,vol:true},strat:{mom:true,rev:true,trend:true,brk:true,vol:true},ord:[],al:[],stk:{url:''},sp:{mom:{rsiLo:52,rsiHi:68,slM:1.5,tpM:2.5},rev:{rsiMax:30,slM:1.5,tpM:2},trend:{slM:2,tpM:4},brk:{vmin:1.5,slM:1.5,tpM:3},vol:{vx:1.6,slM:1.5,tpM:3}},n:0,ver:2,
cfg:{risk:.25,dayLoss:1,dd:5,maxPos:5,fee:.1,slip:.05,stale:60,budget:40,cd:60,minScore:60,minRR:1.2,maxHr:12,ordMin:10,expMax:70,oppBudget:40,oppMax:3,oppMinScore:60,oppMinRR:1.3,oppCd:900,newsMax:10,newsHrs:6,newsMin:5,newsVeto:1,maxAsset:25,trailAct:.4,trail:.3,timeExit:20,partFr:50,partR:1.5,beR:1,logMax:400,fs:15,cyMax:500}});
const LIM={risk:[.01,2],dayLoss:[.1,10],dd:[1,30],maxPos:[1,20],fee:[0,1],slip:[0,1],stale:[10,300],budget:[0,100],cd:[0,3600],minScore:[50,95],minRR:[.5,5],maxHr:[1,60],ordMin:[1,120],expMax:[10,100],oppBudget:[0,100],oppMax:[1,10],oppMinScore:[50,95],oppMinRR:[.5,5],oppCd:[0,7200],newsMax:[0,20],newsHrs:[1,24],newsMin:[1,60],newsVeto:[0,1],maxAsset:[5,50],trailAct:[.1,5],trail:[.05,3],timeExit:[1,240],partFr:[10,90],partR:[.5,5],beR:[.5,3],logMax:[100,1000],fs:[12,20],cyMax:[50,2000]},FIX=[];
function load(){try{const raw=localStorage.getItem('atc_v1');if(!raw)return null;if(!localStorage.getItem('atc_v1_pre2'))localStorage.setItem('atc_v1_pre2',raw);const o=JSON.parse(raw);if(o&&typeof o=='object'&&!Array.isArray(o))return merge(o)}catch(e){FIX.push('Sauvegarde locale illisible : copie conservée dans atc_v1_pre2, démarrage avec les valeurs par défaut.')}return null}
function merge(o){const d=DEF(),ob=x=>x&&typeof x=='object'&&!Array.isArray(x)?x:{};if((o.ver||1)<2)FIX.push('Ancienne sauvegarde (v1) migrée vers la version 2 : portefeuille, historique et transactions inchangés. Copie d\'origine conservée (atc_v1_pre2).');
 Object.assign(d,o,{ver:2,cfg:Object.assign(d.cfg,ob(o.cfg)),sp:Object.assign(d.sp,ob(o.sp)),strat:Object.assign(d.strat,ob(o.strat)),ostrat:Object.assign(d.ostrat,ob(o.ostrat))});
 ['pos','hist','log','eq','ord','al'].forEach(k=>{if(!Array.isArray(d[k])){d[k]=[];FIX.push('Données « '+k+' » corrompues : remises à vide')}});
 ['init','cash','peak','dayStart'].forEach(k=>{if(!(d[k]>0)&&!(k=='cash'&&d[k]===0)){d[k]=k=='init'?10000:(d.init>0?d.init:10000);FIX.push('Valeur « '+k+' » invalide : corrigée')}});
 fixCfg(d.cfg);const sp0=DEF().sp;for(const k in d.sp)for(const q in d.sp[k]){const v=d.sp[k][q];if(!(v>0&&v<1000)){d.sp[k][q]=(sp0[k]||{})[q]||1;FIX.push('Stratégie '+k+'.'+q+' invalide : valeur par défaut rétablie')}}return d}
function fixCfg(c){const D0=DEF().cfg;for(const k in LIM){const v=c[k];if(typeof v!='number'||!isFinite(v)||v<LIM[k][0]||v>LIM[k][1]){FIX.push('Réglage « '+k+' » = '+v+' hors limites ['+LIM[k][0]+' – '+LIM[k][1]+'] : remplacé par '+D0[k]);c[k]=D0[k]}}}
function flushFix(){if(!FIX.length)return;const m=FIX.splice(0);m.forEach(x=>log('Admin','paramètre',x));toast(m.length+' réglage(s) corrigé(s) automatiquement : voir Réglages.')}
function snapCfg(){if(snapCfg.d)return;snapCfg.d=1;try{localStorage.setItem('atc_cfg_prev',JSON.stringify(S.cfg))}catch(e){}}
const SV={err:'',n:0,sz:0,ok:0};
function save(){try{const j=JSON.stringify(S);localStorage.setItem('atc_v1',j);SV.sz=j.length;SV.ok=Date.now();if(SV.err){SV.err='';log('Admin','paramètre','Sauvegarde locale rétablie')}}catch(e){const m=(e&&e.name=='QuotaExceededError')||/quota/i.test(String((e&&e.message)||''))?'stockage du navigateur plein':String((e&&e.message)||e||'refusée').slice(0,80);SV.n++;if(!SV.err)log('Admin','alerte','ÉCHEC DE SAUVEGARDE : '+m+'. Les données de cette session ne sont pas enregistrées : exportez la sauvegarde.');SV.err=m}}
let S=load()||DEF(),M={},H={},FX=0,page='dash',NEWS=null,BTR=null,BTS='BTC',LF='',CAP=S.init,bad=null,CD={},lastOk=0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',5000)}
/* Audit Engine */
const SYRE=new RegExp('\\b('+SY.join('|')+')\\b');let CYS=null,CYERR='';
function log(a,ty,m){const x=String(m).match(SYRE);S.log.unshift({t:Date.now(),a,ty,m,s:x?x[1]:''});if(CYS&&CYS.ev.length<60)CYS.ev.push({a,ty,m:String(m).slice(0,a=='Supervisor'&&ty=='refus'?220:110),s:x?x[1]:''});const mx=(S.cfg&&S.cfg.logMax)||400;if(S.log.length>mx)S.log.length=mx;const c=(S.ac=S.ac||{})[a]=S.ac[a]||{};c[ty]=(c[ty]||0)+1;c.t=Date.now();
 if(a=='Supervisor'&&ty=='refus'){const r=String(m).split(' refusé : ')[1];if(r){S.rj=S.rj||{};r.split(', ').forEach(q=>{const k=q.replace(/[\d.,]+/g,'#');S.rj[k]=(S.rj[k]||0)+1})}}if(ty=='alerte')toast(m)}
/* ===== Market Data Engine (Binance : tickers + bougies 1 min OHLCV) ===== */
const BS=['https://data-api.binance.vision','https://api.binance.com'];
async function bj(p){for(const b of BS){const c=new AbortController(),h=setTimeout(()=>c.abort(),8000);try{const r=await fetch(b+p,{signal:c.signal});if(r.ok)return await r.json()}catch(e){}finally{clearTimeout(h)}}throw new Error('indisponible')}
let K={},D={rc:0,t:0,an:0,sig:0,prop:0,acc:0,ref:0,rej:{},sym:{},why:'',lr:'',sigT:0};
async function pull(){try{
 const d=await bj('/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify([...SY.map(s=>s+'USDT'),'EURUSDT'])));
 const fx=+d.find(x=>x.symbol=='EURUSDT').lastPrice;if(!(fx>0))throw 0;FX=fx;const now=Date.now();
 d.forEach(x=>{const s=x.symbol.replace('USDT','');if(s!='EUR')M[s]={p:+x.lastPrice/FX,chg:+x.priceChangePercent,vol:+x.quoteVolume/FX,t:now}});
 await Promise.all(SY.map(async s=>{try{const k=(await bj('/api/v3/klines?symbol='+s+'USDT&interval=1m&limit=120')).map(x=>({h:+x[2]/FX,l:+x[3]/FX,c:+x[4]/FX,v:+x[5],ct:x[6]})).filter(x=>x.ct<now);k.t=now;K[s]=k;H[s]=k.map(x=>x.c)}catch(e){}}));
 bad=null;lastOk=now}catch(e){bad='Données de marché indisponibles : aucune opération ne peut être ouverte tant que la connexion à Binance ne revient pas.'}}
const fresh=s=>M[s]&&Date.now()-M[s].t<S.cfg.stale*1000;
/* ===== Indicateurs & Analyst Engine ===== */
const sma=(a,n)=>a.slice(-n).reduce((x,y)=>x+y,0)/n,ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(x=>e=x*k+e*(1-k))},
sd=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)};
function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}return l==0?100:100-100/(1+g/l)}
function atr(k,n){let t=0;for(let i=k.length-n;i<k.length;i++)t+=Math.max(k[i].h-k[i].l,Math.abs(k[i].h-k[i-1].c),Math.abs(k[i].l-k[i-1].c));return t/n}
function ind(s){const k=K[s];if(!k||k.length<60||!fresh(s)||Date.now()-k.t>S.cfg.stale*1000)return null;
 const c=H[s],n=c.length,e12=ema(c,12),e26=ema(c,26),ml=e12.map((x,j)=>x-e26[j]),sg=ema(ml,9),m=sma(c,20),b=sd(c.slice(-20)),pv=k.slice(-21,-1);
 return{p:M[s].p,pc:c[n-1],r:rsi(c),f:sma(c,5),m,s50:sma(c,50),mh:ml[n-1]-sg[n-1],bu:m+2*b,bl:m-2*b,a:atr(k,14),ar:atr(k,5)/atr(k,30),vr:k[n-1].v/(pv.reduce((t,x)=>t+x.v,0)/20),hh:Math.max(...k.slice(-20).map(x=>x.h))}}
const SD={
mom:{n:'Momentum',d:'Entrée : MA5>MA20, RSI dans la fourchette, MACD>signal. Sortie : MA5<MA20, stop ATR ou objectif ATR.',e:(i,P)=>i.f>i.m&&i.r>P.rsiLo&&i.r<P.rsiHi&&i.mh>0,x:i=>i.f<i.m},
rev:{n:'Mean Reversion',d:'Entrée (ordre limite sous le marché) : RSI en survente, prix sous la bande de Bollinger basse, bougie de rebond. Sortie : retour à la moyenne.',e:(i,P)=>i.r<P.rsiMax&&i.p<i.bl&&i.p>i.pc,x:i=>i.p>=i.m},
trend:{n:'Trend Following',d:'Entrée : prix>MA20>MA50 et MACD>signal. Sortie : prix<MA50.',e:i=>i.p>i.m&&i.m>i.s50&&i.mh>0,x:i=>i.p<i.s50},
brk:{n:'Breakout',d:'Entrée : cassure du plus haut des 20 dernières minutes avec volume au-dessus du seuil. Sortie : prix<MA20.',e:(i,P)=>i.p>i.hh&&i.vr>=P.vmin,x:i=>i.p<i.m},
vol:{n:'Trading de volatilité',d:'Entrée : expansion de la volatilité ATR(5)/ATR(30) au-dessus du seuil, prix>MA20, MACD>signal. Sortie : prix<MA20.',e:(i,P)=>i.ar>=P.vx&&i.p>i.m&&i.mh>0,x:i=>i.p<i.m}};
function analyse(s){const i=ind(s);if(!i)return{s,n:(H[s]||[]).length,sig:null};let b=null;
 for(const k in SD)if(S.strat[k]&&SD[k].e(i,S.sp[k])){const c=Math.min(95,50+(i.mh>0?15:0)+(i.vr>1.2?15:0)+(i.p>i.s50?15:0));if(!b||c>b.conf)b={st:k,conf:c}}
 return{s,n:H[s].length,i,r:i.r,f:i.f,m:i.m,p:i.p,sig:b?SD[b.st].n:null,st:b&&b.st,conf:b?b.conf:0}}
/* ===== Portfolio / Risk Engine ===== */
const eq=()=>S.cash+S.pos.reduce((t,x)=>t+x.q*(M[x.s]?M[x.s].p:x.e),0),engaged=a=>S.pos.filter(x=>!a||agOf(x)==a).reduce((t,x)=>t+x.q*x.e,0),
lossy=a=>{const h=S.hist.filter(x=>!a||agOf(x)==a).slice(0,3);return h.length>=3&&h.every(x=>x.pnl<0)},
reserved=()=>S.ord.filter(o=>o.status=='open').reduce((t,o)=>t+(o.q-o.filled)*o.lim*(1+S.cfg.fee/100),0);
function risk(p){const c=S.cfg,E=eq(),R=[];
 if(S.emerg)R.push('arrêt d\'urgence actif');if(S.halt)R.push('limite atteinte : '+S.halt);
 if(!fresh(p.s))R.push('donnée périmée ou absente');
 if(!(p.q>0&&isFinite(p.q)&&isFinite(p.entry)&&isFinite(p.sl)&&isFinite(p.tp)&&isFinite(p.rr)&&p.sl>0&&p.sl<p.entry&&p.entry<p.tp))R.push('prix incohérents (il faut SL < entrée < TP) : SL '+f2(p.sl,4)+' · entrée '+f2(p.entry,4)+' · TP '+f2(p.tp,4)+' · quantité '+f2(p.q,5));else if((p.entry-p.sl)/p.entry>.25)R.push('stop-loss à plus de 25 % de l\'entrée : volatilité mesurée incohérente');
 if(p.type=='limit'&&fresh(p.s)&&p.lim>=M[p.s].p)R.push('limite d\'achat au-dessus du marché');
 if(S.pos.length+S.ord.filter(o=>o.status=='open').length>=c.maxPos)R.push('nombre max de positions/ordres atteint');
 if(S.pos.some(x=>x.s==p.s)||S.ord.some(o=>o.s==p.s&&o.status=='open'))R.push('position ou ordre déjà ouvert sur '+p.s);
 if(p.risk>E*c.risk/100*1.001)R.push('risque '+f2(p.risk)+' € > limite '+f2(E*c.risk/100)+' €');
 if(p.cost>E*c.maxAsset/100)R.push('exposition par actif > '+c.maxAsset+' %');if(engaged()+p.cost>E*c.expMax/100)R.push('exposition totale > '+c.expMax+' % du capital');if(agOf(p)=='opp'&&S.pos.filter(x=>agOf(x)=='opp').length+S.ord.filter(o=>o.status=='open'&&agOf(o)=='opp').length>=c.oppMax)R.push('nombre max de positions Opportunity atteint');
 if(p.cost+p.fee>S.cash-reserved())R.push('cash insuffisant');
 {const m=rrMin(p);if(p.rr<m)R.push('rendement/risque net '+f2(p.rr)+' < '+f2(m)+' (frais et slippage inclus)')}
 return R}
function limits(){const E=eq(),c=S.cfg;if(S.day!=new Date().toDateString()){S.day=new Date().toDateString();S.dayStart=E;if(S.halt&&S.halt.startsWith('perte'))S.halt=null}
 S.peak=Math.max(S.peak,E);if(S.halt)return;const dl=(E-S.dayStart)/S.dayStart*100,dd=(S.peak-E)/S.peak*100;
 if(dl<=-c.dayLoss)stop('perte journalière '+f2(dl)+' % (limite '+c.dayLoss+' %)');else if(dd>=c.dd)stop('drawdown '+f2(dd)+' % (limite '+c.dd+' %)')}
function stop(m){S.halt=m;if(S.scalp=='run')S.scalp='pause';if(S.opp=='run')S.opp='pause';log('Risk','alerte','Blocage automatique : '+m+'. Nouvelles opérations bloquées, agents suspendus.')}
/* ===== Simulation Engine : ordres marché / limite, exécutions partielles ===== */
function mkp(s,type,lim,sl,tp,q,st){const c=S.cfg,pr=M[s].p,f=c.fee/100,entry=type=='limit'?lim:pr*(1+c.slip/100),cost=q*entry,k=entry*(2*f+c.slip/100),rpu=entry-sl+k;
 return{s,type,lim,entry,sl,tp,q,cost,fee:cost*f,risk:q*rpu,rr:rpu>0?(tp-entry-k)/rpu:0,st}}
function order(p,R){const o={id:++S.n,s:p.s,type:p.type,lim:p.lim,entry:p.entry,q:p.q,filled:0,sl:p.sl,tp:p.tp,st:p.st,tf:p.tf,a:p.a,t:Date.now(),status:R?'rejected':'open',why:R?R.join(', '):''};
 S.ord.unshift(o);if(S.ord.length>200)S.ord.length=200;
 if(!R&&p.type=='market')fill(o,p.q,p.entry);else if(!R)log('Simulation','ordre',`Ordre limite ${o.id} ${p.s} @ ${f2(p.lim,4)} € en attente`)}
function fill(o,q,px){const fee=q*px*S.cfg.fee/100;S.cash-=q*px+fee;let x=S.pos.find(p=>p.oid==o.id);
 if(x){x.e=(x.e*x.q+px*q)/(x.q+q);x.q+=q;x.fee+=fee;x.hi=Math.max(x.hi,px)}else S.pos.push({id:++S.n,oid:o.id,s:o.s,q,e:px,sl:o.sl,tp:o.tp,hi:px,fee,t:Date.now(),st:o.st,tf:o.tf,a:o.a,r0:px-o.sl});
 if(!o.filled)apx(agOf(o)).exe++;o.filled+=q;if(o.q-o.filled<=o.q*1e-9)o.status='filled';log('Simulation','exécution',`${o.status=='filled'?'Exécution':'Exécution partielle'} ${o.s} ${f2(q,5)} @ ${f2(px,4)} € (frais ${f2(fee)} €)`)}
function orders(){const now=Date.now();S.ord.filter(o=>o.status=='open').forEach(o=>{
 if(now-o.t>S.cfg.ordMin*60000){o.status='cancelled';o.why='expiré';apx(agOf(o)).exp++;log('Simulation','ordre','Ordre '+o.id+' expiré');return}
 if(S.emerg||S.halt||!fresh(o.s))return;if(M[o.s].p<=o.lim){const r=o.q-o.filled;fill(o,r*.5*o.lim<10?r:r*.5,o.lim)}})}
function cancelAll(){S.ord.forEach(o=>{if(o.status=='open'){o.status='cancelled';o.why='arrêt d\'urgence'}})}
function close(x,why,px){const c=S.cfg,ex=px*(1-c.slip/100),pr=x.q*ex,fee=pr*c.fee/100,pnl=pr-fee-(x.q*x.e+x.fee);
 S.cash+=pr-fee;S.pos=S.pos.filter(p=>p.id!=x.id);S.hist.unshift({t:Date.now(),s:x.s,q:x.q,e:x.e,x:ex,pnl,fees:x.fee+fee,why,st:x.st});if(S.hist.length>500)S.hist.length=500;
 log('Seller','fermeture',`${x.s} fermé (${why}) P&L net ${f2(pnl)} €`);
 S.al.forEach(a=>{if(a.on&&a.s==x.s&&((a.ty=='sl'&&/stop/.test(why))||(a.ty=='tp'&&why=='take-profit')))fire(a,why+' exécuté, P&L '+f2(pnl)+' €')})}
/* Seller Engine */
function monitor(){[...S.pos].forEach(x=>{if(!fresh(x.s))return;if(agOf(x)=='opp')return oppMon(x);const p=M[x.s].p;x.hi=Math.max(x.hi,p);

  if(up&&!q){const px=c[i]*(1+slip);q=cash/(px*(1+fee));cash-=q*px*(1+fee);ent=px*(1+fee)}
  else if(!up&&q){const px=c[i]*(1-slip),v=q*px*(1-fee);tr.push(v-q*ent);cash+=v;q=0}
  eqs.push(cash+q*c[i])}
 if(q){const v=q*c[c.length-1]*(1-slip)*(1-fee);tr.push(v-q*ent);cash+=v;eqs[eqs.length-1]=cash}

 if(q=='opt')return'L\'Optimiseur (page Optimiseur) calcule des recommandations sur les données Binance et les valide hors échantillon. Je ne les applique pas automatiquement et je n\'invente aucune optimisation : lancez l\'analyse dans cette page, puis dites-moi quels réglages reprendre, je les proposerai avec validation.';
 if(q=='hist')return C.log.length?'<b>Dernières commandes journalisées</b><br>'+C.log.slice(0,8).map(l=>dt(l.t)+' · '+esc(l.cmd)+' → <b>'+esc(l.conf)+'</b>'+(l.ch.length?' ('+l.ch.map(x=>esc(x.k)+' '+x.old+'→'+x.nw).join(', ')+')':'')+(l.err?' · erreur : '+esc(l.err):'')).join('<br>'):'Aucune commande journalisée pour l\'instant.';
 if(q=='bilan'){ln.push('<b>Équipe</b> : capital '+f2(E)+' € ('+f2((E-S.init)/S.init*100)+' % depuis le début), '+S.pos.length+' position(s) ouverte(s)'+(S.emerg?' · arrêt d\'urgence actif':S.halt?' · blocage : '+esc(S.halt):'')+'.');['sc','opp'].forEach(b=>{const s=bst(b),a=s.agg,w=aggWin(b,7);ln.push('<b>'+bn(b)+'</b> : '+(b=='sc'?scState():oppState())+' · '+S.pos.filter(x=>agOf(x)==b).length+' position(s) · net réalisé '+f2(s.net)+' € ('+a.tn+' clôtures, réussite '+(a.wr==null?'—':f2(a.wr,0)+' %')+', PF '+pfS(a.pf)+', espérance '+(a.ex==null?'—':f2(a.ex)+' €')+') · 7 jours '+f2(w.net)+' € · drawdown réalisé '+f2(a.dd)+' € · capital alloué '+f2(s.al)+' €.')});ln.push('Réglages : risque '+c.risk+' %, perte jour max '+c.dayLoss+' %, drawdown max '+c.dd+' %, exposition max '+c.expMax+' %, positions max '+c.maxPos+' (Opportunity '+c.oppMax+'). Profils appliqués : Scalper '+(C.mode.sc||'—')+', Opportunity '+(C.mode.opp||'—')+'.');return ln.join('<br>')}
 if(q=='r24'){const T=Date.now()-864e5;ln.push('<b>Dernières 24 heures</b> (clôtures complètes, ventes partielles fusionnées)');['sc','opp'].forEach(b=>{const P=PJ().filter(r=>r.ag==b&&r.t>=T),w=P.filter(r=>r.pnl>0).length,net=P.reduce((t,r)=>t+r.pnl,0);ln.push(bn(b)+' : '+(P.length?P.length+' clôture(s), '+w+' gagnante(s) ('+f2(w/P.length*100,0)+' %), résultat '+f2(net)+' €':'aucune clôture')+(P.length&&P.length<10?' (échantillon très faible : indicatif)':''))});ln.push('Frais payés : '+f2(S.hist.filter(h=>h.t>=T).reduce((t,h)=>t+h.fees,0))+' €.');return ln.join('<br>')}
 if(q=='why'){if(S.emerg)ln.push('Arrêt d\'urgence actif : toutes les entrées sont bloquées.');if(S.halt)ln.push('Blocage du Risk Manager : '+esc(S.halt));[['sc',S.scalp,scState(),D.why],['opp',S.opp,oppState(),OD.why]].forEach(([b,st,s,w])=>{const x=bst(b);ln.push('<b>'+bn(b)+'</b> : '+s+(st!='run'?' → aucune entrée possible tant qu\'il n\'est pas en marche.':(w?' · '+esc(w):'')+' · '+x.acc+' proposition(s) acceptée(s), '+x.ref+' refusée(s).'))});if(S.pos.length+S.ord.filter(o=>o.status=='open').length>=c.maxPos)ln.push('Nombre maximal de positions/ordres atteint ('+c.maxPos+').');if(engaged()>=E*c.expMax/100*.95)ln.push('Exposition proche du plafond de '+c.expMax+' %.');ln.push('Les bots n\'entrent que si les filtres de qualité et le Risk Manager valident : <b>aucune transaction n\'est forcée</b>. Le détail des refus est dans Agents et Échanges.');return ln.join('<br>')}}
function ccRun(raw){const C=CC(),t=String(raw||'').trim().slice(0,300);if(!t)return;ccPush('u',esc(t));let r;try{r=ccExec(CCP[CCPV].parse(t),t)}catch(e){r={h:'Erreur interne : '+esc(e.message)};jl({cmd:t,interp:'Erreur',conf:'refusée',err:e.message})}ccPush('a',r.h);ccDraw()}
function ccDraw(){save();head();if(page=='cc'){render();const b=$('#ccbox');if(b)b.scrollTop=b.scrollHeight}}
function ccPfSet(d,val){const[b,p,k]=d.split('.'),C=CC(),v=+val,[lo,hi]=ccBnd(k);if(val===''||!isFinite(v)||v<lo||v>hi){toast('Valeur refusée : entre '+lo+' et '+hi+' depuis le chat.');return render()}const o=C.prof[b][p][k];C.prof[b][p][k]=v;jl({cmd:'Profil '+b+' '+p,interp:'Réglage de profil '+k,ch:[{k,old:o,nw:v}],conf:'non requise (appliqué seulement après validation d\'un profil)'});save();toast('Profil mis à jour : sera appliqué après validation.');render()}
PAGES.cc=()=>{const C=CC(),P=C.pend,g=C.goals,nm={prudent:'Prudent',equilibre:'Équilibré',dynamique:'Dynamique'},
 ch=['Augmente légèrement le risque du Scalper','Réduis le risque des deux bots','Passe Opportunity en mode prudent','Pourquoi les bots ne prennent-ils pas de positions ?','Analyse les résultats des dernières 24 heures','Fais-moi un bilan complet de l\'équipe','Mets les deux bots en pause','Relance les deux bots'],
 msgs=C.chat.slice(-30).map(m=>`<div class="sm" style="margin:6px 0;padding:8px 10px;border-radius:10px;max-width:92%;${m.r=='u'?'margin-left:auto;background:rgba(80,140,255,.18)':'background:rgba(128,128,128,.14)'}">${m.h}</div>`).join('')||'<div class="sm g">Écrivez une commande ou touchez un exemple.</div>',
 pend=P?`<div class="card" style="border:1px solid ${P.sens?'#d33':'#888'}"><b>${P.sens?'⚠ Modification sensible à valider':'Modification à valider'}</b><div class="sm g">${esc(P.interp)}</div>${P.kind=='run'?tbl(['Bot','État actuel','Nouvel état'],P.runs.map(b=>[bn(b),AG.on[S[b=='sc'?'scalp':'opp']],'En marche'])):tbl(['Paramètre','Actuel','Nouveau'],P.changes.map(c=>[esc(CCR[c.k][0]),c.old,'<b>'+c.nw+'</b>']))}<div class="sm warn">${P.notes.map(esc).join('<br>')}</div><div class="btns"><button class="${P.sens?'d':'s'}" data-a="ccok">Valider</button><button class="s" data-a="ccno">Annuler</button></div></div>`:'',
 prof=['sc','opp'].map(b=>{const ks=Object.keys(CCPF[b].equilibre);return`<div class="card"><b>Profils ${bn(b)}</b> <span class="sm g">(actif : ${C.mode[b]?nm[C.mode[b]]:'aucun appliqué'})</span>${tbl(['Réglage','Prudent','Équilibré','Dynamique'],ks.map(k=>[esc(CCR[k][0]),...['prudent','equilibre','dynamique'].map(p=>`<input type="number" step="any" inputmode="decimal" style="width:72px" data-pf="${b}.${p}.${k}" value="${C.prof[b][p][k]}">`)]))}<div class="btns">${['prudent','equilibre','dynamique'].map(p=>`<button class="s" data-a="ccpf" data-v="${b}|${p}">${nm[p]}</button>`).join('')}</div></div>`}).join(''),
 jr=C.log.slice(0,12).map(l=>`<div class="sm" style="border-top:1px solid rgba(128,128,128,.25);padding:4px 0">${dt(l.t)} · ${esc(l.cmd)}<br><span class="g">${esc(l.interp)}${l.ch.length?' · '+l.ch.map(x=>esc(x.k)+' '+x.old+'→'+x.nw).join(', '):''} · <b>${esc(l.conf)}</b>${l.res?' · '+esc(l.res):''}${l.err?' · <span class="bad">erreur : '+esc(l.err)+'</span>':''}</span></div>`).join('')||'<div class="sm g">Aucune commande journalisée.</div>';
 return`<div class="card"><b>AI Command Center</b><div class="sm g">Pilotage par conversation des deux bots. Moteur : ${CCP[CCPV].name}. Aucune connexion Internet, aucun modèle distant. Il n'agit que sur les réglages existants, avec validation avant toute modification, et le Risk Manager garde l'autorité finale.</div></div>
<div class="card"><div id="ccbox" style="max-height:44vh;overflow:auto">${msgs}</div><div class="btns" style="margin-top:8px"><input id="ccin" placeholder="Écrivez une commande…" autocomplete="off" style="flex:1;min-width:0"><button class="s" data-a="ccsend">Envoyer</button></div><div class="btns" style="flex-wrap:wrap">${ch.map(t=>`<button class="s" style="min-height:32px;padding:4px 10px;font-size:.8em" data-a="ccq" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>${pend}
<div class="card"><b>Objectifs de rendement (indicatifs)</b><div class="sm g">Aucun effet sur les bots : un objectif n'oblige jamais une position, ne désactive aucun filtre, n'augmente jamais le risque.</div>${[['d','Journalier'],['w','Hebdomadaire'],['m','Mensuel']].map(([x,l])=>`<div class="row"><span class="g">${l} (%)</span><input type="number" step="any" inputmode="decimal" style="width:90px" data-gl="${x}" value="${g[x]==null?'':g[x]}" placeholder="—"></div>`).join('')}<div class="sm" style="margin-top:6px">${ccGoalEval()}</div></div>${prof}
<div class="card"><b>Plafonds absolus (non modifiables depuis le chat)</b><div class="sm g">Risque ${CMAX.risk} % · perte jour ${CMAX.dayLoss} % · drawdown ${CMAX.dd} % · exposition ${CMAX.expMax} % · par actif ${CMAX.maxAsset} % · positions ${CMAX.maxPos} (Opportunity ${CMAX.oppMax}) · capital par bot ${CMAX.budget} % · frais ≥ ${CMIN.fee} % · slippage ≥ ${CMIN.slip} % · seuils ≥ ${CMIN.minScore} · rendement/risque ≥ ${CMIN.minRR}. Au-delà : uniquement via Réglages, et toujours dans les limites de l'application.</div></div>
<div class="card"><b>Configurations validées (restauration)</b>${C.snaps.slice(0,8).map(s=>`<div class="row"><span class="sm">${dt(s.t)} · ${esc(s.label.slice(0,60))}</span><button class="s" style="min-height:32px;padding:4px 10px" data-a="ccrs" data-v="${s.id}">Restaurer</button></div>`).join('')}</div>
<div class="card"><b>Journal du Command Center</b>${jr}</div>`};

/* Start */
/* ===== Phase 9 (cœur) : profils du Scalper, score pondéré, objectif net adapté aux coûts, taxonomie des refus.
   Règles programmées et statistiques simples : AUCUN modèle d'apprentissage automatique. Les paramètres des profils sont des hypothèses non validées (à confronter au Labo et à l'Optimiseur). ===== */
const P9PR={prudent:{n:'Prudent',ms:70,edge:1,k:3,soft:1.2,rr:1.2},equilibre:{n:'Équilibré',ms:60,edge:.6,k:3.5,soft:1,rr:1},dynamique:{n:'Dynamique',ms:52,edge:.4,k:4,soft:.7,rr:.8}},P9RRMIN=.6,P9L={},
P9=()=>{const p=S.p9=S.p9&&typeof S.p9=='object'?S.p9:{};if(!P9PR[p.prof])p.prof='dynamique';if(!p.rf||typeof p.rf!='object')p.rf={};if(!(p.n>=0))p.n=0;return p},p9pf=()=>P9PR[P9().prof],
rrMin=p=>SD[p.st]&&agOf(p)=='sc'?Math.max(P9RRMIN,Math.min(S.cfg.minRR,p9pf().rr)):S.cfg.minRR,
p9cl=m=>/^refusée/.test(m)?(/conflit|AI News|Supervisor/.test(m)?'Refus du Supervisor':'Refus du Risk Manager'):/acceptée|transmise/.test(m)?'Proposition transmise ou acceptée':/frais trop/.test(m)?'Frais trop élevés':/volume insuffisant/.test(m)?'Volume insuffisant':/déjà ouvert/.test(m)?'Position déjà ouverte':/taille nulle|cash|budget/.test(m)?'Capital insuffisant':/R\/R|rendement/.test(m)?'Rendement net insuffisant':/périmée|absente|historique/.test(m)?'Données indisponibles':/aucun signal/.test(m)?'Aucun signal détecté':/score|filtres|tardive|anti-répétition/.test(m)?'Signal détecté mais insuffisant':'Autre';
/* Filtre d'entrée : seuls les blocages économiques ou extrêmes sont éliminatoires ; le reste est une pénalité de score pondérée par le profil */
scGate=function(i,k,P){const p=P85(),X=i.X;if(!p.on||!X)return'';const c=S.cfg,pf=p9pf(),cost=2*c.fee+c.slip,a=i.a/i.p*100,ex=(i.p-i.m)/i.a,need=cost*(1+pf.edge),pen=[],A=(l,v)=>pen.push([l,v*pf.soft]);
 if(need>pf.k*a)return`frais trop élevés : avantage net insuffisant (il faut +${f2(need)} % pour des coûts de ${f2(cost)} %, ATR 1 min ${f2(a,2)} %)`;
 if(i.vr<.3)return`volume insuffisant (×${f2(i.vr)})`;if(i.r>80||ex>=3)return`entrée trop tardive (RSI ${f2(i.r,0)}, ${f2(ex)} ATR de la MA20)`;
 if(k=='rev'){if(!(X.up&&i.r>X.rp))A('rebond non confirmé',12)}else{if(i.r>70||i.p>i.bu||ex>=2)A('entrée tardive',10);if(i.p-i.pc>i.a)A('prix > 1 ATR au-dessus de la clôture',8);if(i.mh<=0||i.mh<X.mhp)A('momentum clôturé non confirmé',8);if(k=='brk'&&!(X.cb&&X.w<=.5))A('faux breakout probable',15);if(i.ar<.7&&k!='trend')A('volatilité en contraction',8)}
 if(i.vr<p.minVol)A('volume faible ×'+f2(i.vr),10);if(htBear(i))A('tendance 1 h / 4 h baissière',12);
 (i.p9=i.p9||{})[k]={pen:pen.reduce((t,x)=>t+x[1],0),w:pen.map(x=>x[0]).join(', ')};return''};
{const a0=analyse;analyse=function(s){const r=a0(s),q=r.sig&&r.i&&r.i.p9&&r.i.p9[r.st];P9L[s]=null;if(q){P9L[s]={raw:r.conf,pw:q.w};r.conf=Math.max(0,Math.round(r.conf-q.pen))}return r}}
/* Objectif net : relevé au minimum rentable après coûts si la volatilité le permet, sinon l'entrée est refusée en amont (frais trop élevés) */
{const b0=buyer;buyer=function(a){const p=b0(a),c=S.cfg,pf=p9pf(),k=p.entry*(2*c.fee/100+c.slip/100),mn=p.entry+k*(1+pf.edge);if(p.tp<mn&&mn-p.entry<=pf.k*a.i.a){p.tp=mn;const u=p.entry-p.sl+k;p.rr=u>0?(p.tp-p.entry-k)/u:0}return p}}
{const s0=scalper;scalper=function(){const c=S.cfg,m0=c.minScore,r0=c.minRR,pf=p9pf();if(S.scalp=='run'){c.minScore=pf.ms;c.minRR=Math.min(c.minRR,pf.rr)}try{const r=s0();SY.forEach(s=>{const m=D.sym[s],l=P9L[s];if(m&&l&&/ignoré : score/.test(m)&&!/pénalités/.test(m))D.sym[s]=m+` · brut ${l.raw}, pénalités : ${l.pw||'aucune'}`});return r}finally{c.minScore=m0;c.minRR=r0}}}
{const a0=arbitrate;arbitrate=function(){const r=a0.apply(this,arguments);try{const p=P9();if(S.scalp=='run'&&D.rc&&p.lc!=D.rc){p.lc=D.rc;p.n++;Object.values(D.sym||{}).forEach(m=>{const k=p9cl(String(m));p.rf[k]=(p.rf[k]||0)+1})}}catch(e){}return r}}
ACT.p9=v=>{if(!P9PR[v])return;P9().prof=v;log('Admin','paramètre','Profil du Scalper : '+P9PR[v].n);save();render()};
{const p0=PAGES.scalp;PAGES.scalp=function(){const p=P9(),pf=p9pf(),rf=Object.entries(p.rf).sort((a,b)=>b[1]-a[1]),tot=rf.reduce((t,x)=>t+x[1],0)||1;
 return p0()+`<div class="card"><b>Profil du Scalper · Phase 9</b><div class="btns">${Object.keys(P9PR).map(k=>`<button class="${p.prof==k?'':'s'}" data-a="p9" data-v="${k}">${P9PR[k].n}</button>`).join('')}</div><div class="sm g">Seuil de score ${pf.ms} · avantage net minimal ×${pf.edge} des coûts · R/R net minimal ${pf.rr} (plancher du Risk Manager : ${P9RRMIN}). Ce profil remplace le seuil de score et le R/R du Scalper tant qu'il est actif. Hypothèses non validées statistiquement ; règles programmées, sans apprentissage automatique.</div></div><div class="card"><b>Motifs d'inaction (${p.n} cycles)</b>${rf.map(([k,v])=>row(esc(k),v+' ('+f2(v/tot*100,0)+' %)')).join('')||'<p class="g">Aucun cycle analysé depuis la mise à jour.</p>'}</div>`}}
